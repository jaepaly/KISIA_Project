<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Veilo{% endblock %}</title>
  <link rel="stylesheet" href="/static/fonts/pretendard.css">
  <link rel="stylesheet" href="/static/veilo.css">
  <link rel="stylesheet" href="/static/fx.css">
  {# 파도풀 주소 — app.py PADO_BASE. pado.js · 글쓰기 화면 스크립트가 읽는다 #}
  <script>window.PADO_BASE = {{ pado_base|tojson }};</script>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="ut-top" id="utTop">
    <div class="ut-top-in">
      <button class="ut-menu" id="utMenuBtn" aria-label="메뉴 열기">☰</button>
      <a class="ut-logo" href="/">
        <img class="sym" src="/static/veilo-symbol.svg" alt="" width="28" height="28">
        <span class="wm">Veilo</span>
      </a>
      <nav class="ut-nav">
        {% block nav %}
        <a href="/new" class="write">✏️ 글쓰기</a>
        {% endblock %}
      </nav>
    </div>
  </div>

  {# 모바일 사이드바 딤 오버레이 #}
  <div class="ut-scrim" id="utScrim" hidden></div>

  {% block body %}{% endblock %}

  {# 모바일 하단 탭바 #}
  <nav class="ut-tabs">
    <a href="/" class="{% if request.path == '/' %}on{% endif %}">
      <span class="ic">🏠</span>홈
    </a>
    <a href="/new" class="{% if request.path == '/new' %}on{% endif %}">
      <span class="ic">✏️</span>글쓰기
    </a>
  </nav>
  <script src="/static/veilo.js"></script>
  <script src="/static/fx.js"></script>
  <script>
    // 헤더 스크롤 shadow
    (function () {
      const top = document.getElementById("utTop");
      if (!top) return;
      const apply = () => top.classList.toggle("scrolled", window.scrollY > 8);
      apply();
      window.addEventListener("scroll", apply, { passive: true });
    })();

    // 모바일 사이드바 드로어 열기/닫기
    (function () {
      const btn = document.getElementById("utMenuBtn");
      const scrim = document.getElementById("utScrim");
      const side = document.querySelector(".ut-side");
      if (!btn || !side) return;
      function open() { side.classList.add("open"); scrim.hidden = false; document.body.style.overflow = "hidden"; }
      function close() { side.classList.remove("open"); scrim.hidden = true; document.body.style.overflow = ""; }
      btn.addEventListener("click", open);
      scrim.addEventListener("click", close);
      side.querySelectorAll("a[href]").forEach(a => a.addEventListener("click", close));
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>

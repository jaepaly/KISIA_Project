<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}파도풀 SNS{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, "Malgun Gothic", sans-serif; max-width: 720px;
           margin: 0 auto; padding: 16px; color: #222; background: #fafafa; }
    header { display: flex; justify-content: space-between; align-items: center;
              margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #333; }
    header a.logo { font-weight: bold; font-size: 1.2em; color: #222; text-decoration: none; }
    header nav a { margin-left: 12px; color: #555; text-decoration: none; font-size: 0.9em; }
    .post-card { background: #fff; border: 1px solid #ddd; border-radius: 6px;
                 padding: 14px; margin-bottom: 10px; }
    .post-card.private { background: #eee; color: #888; }
    .post-title { font-weight: bold; text-decoration: none; color: #222; }
    .post-meta { font-size: 0.82em; color: #888; margin-top: 4px; }
    .badge { display: inline-block; font-size: 0.75em; padding: 1px 6px;
             border-radius: 3px; background: #ddd; color: #555; }
    .badge.private { background: #555; color: #fff; }
    form.inline { display: inline; }
    input, textarea, select { width: 100%; padding: 8px; margin: 4px 0 12px;
      border: 1px solid #ccc; border-radius: 4px; font-family: inherit; font-size: 1em; }
    label { font-size: 0.85em; color: #555; font-weight: bold; }
    button { padding: 8px 16px; border: none; border-radius: 4px; background: #333;
             color: #fff; cursor: pointer; font-size: 0.9em; }
    button.ghost { background: #eee; color: #333; }
    .empty { color: #999; text-align: center; padding: 40px 0; }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/">파도풀</a>
    <nav>
      <a href="/new">✏️ 글쓰기</a>
    </nav>
  </header>
  {% block content %}{% endblock %}
</body>
</html>

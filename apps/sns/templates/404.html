{% extends "base.html" %}
{% block title %}찾는 글이 없습니다 — Veilo{% endblock %}

{% block body %}
<div class="ut-shell no-rail">
  <main class="ut-main">
    <div class="ut-wrap" style="max-width:560px;margin:56px auto;padding:0 16px;">
      <div class="ut-card" style="text-align:center;padding:32px 24px;">
        <div style="font-size:36px;line-height:1;margin-bottom:12px;">🔎</div>
        <h1 style="font-size:20px;margin:0 0 8px;">찾는 글이 없습니다</h1>
        <p style="font-size:14px;color:var(--ut-ink2);margin:0 0 20px;line-height:1.6;word-break:keep-all;">
          지워졌거나 이 브라우저의 체험용 사본에 없는 글입니다. 주소를 다시 확인해 주세요.
        </p>
        <a href="/" class="fx-btn" style="display:inline-block;background:var(--ut-earth);color:#fff;border-radius:12px;padding:10px 20px;font-weight:700;text-decoration:none;">홈으로</a>
      </div>
    </div>
  </main>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}글 작성 — Veilo{% endblock %}

{% block body %}
<div class="ut-shell no-rail">
  <main class="ut-main">
    <div class="ut-wrap" style="max-width:720px;margin:24px auto;padding:0 16px;">
      <div class="ut-h"><h1>글 작성</h1></div>

      {% if not authors %}
      <div class="ut-card" style="color:var(--ut-ink3);">
        작성자가 아직 없습니다. <code>authors</code> 테이블에 최소 1명을 먼저 넣어야 합니다.
      </div>
      {% endif %}

      <div class="ut-card rv">
        <form method="post" action="/posts">
          <div style="margin-bottom:14px;">
            <label style="font-size:12px;font-weight:700;color:var(--ut-ink3);display:block;margin-bottom:4px;">작성자</label>
            <select name="author_id" required
                    style="width:100%;height:44px;border:1px solid var(--ut-line);border-radius:10px;
                           background:var(--ut-panel2);font:inherit;font-size:14px;color:var(--ut-ink);padding:0 12px;">
              {% for a in authors %}
              <option value="{{ a.author_id }}">{{ a.nickname }}</option>
              {% endfor %}
            </select>
          </div>

          <div style="margin-bottom:14px;">
            <label style="font-size:12px;font-weight:700;color:var(--ut-ink3);display:block;margin-bottom:4px;">제목 (선택)</label>
            <input type="text" name="title" id="title"
                   style="height:44px;border:1px solid var(--ut-line);border-radius:10px;
                          background:var(--ut-panel2);font:inherit;font-size:14px;padding:0 14px;">
          </div>

          <div style="margin-bottom:14px;">
            <label style="font-size:12px;font-weight:700;color:var(--ut-ink3);display:block;margin-bottom:4px;">본문</label>
            <textarea name="body" id="body" rows="8" required
                      style="border:1px solid var(--ut-line);border-radius:10px;
                             background:var(--ut-panel2);font:inherit;font-size:14px;
                             padding:12px 14px;resize:vertical;line-height:1.7;"></textarea>
          </div>

          <div style="margin-bottom:14px;">
            <label style="font-size:12px;font-weight:700;color:var(--ut-ink3);display:block;margin-bottom:4px;">위치 태그 (선택)</label>
            <input type="text" name="geo_tag"
                   placeholder="예: 용인시 기흥구"
                   style="height:44px;border:1px solid var(--ut-line);border-radius:10px;
                          background:var(--ut-panel2);font:inherit;font-size:14px;padding:0 14px;">
          </div>

          <div style="margin-bottom:14px;">
            <label style="font-size:12px;font-weight:700;color:var(--ut-ink3);display:block;margin-bottom:4px;">
              사진 캡션 (선택, 한 줄에 하나씩)
            </label>
            <textarea name="captions" rows="3"
                      placeholder="집 근처라 자주 가는 곳&#10;저녁노을이 예뻤음"
                      style="border:1px solid var(--ut-line);border-radius:10px;
                             background:var(--ut-panel2);font:inherit;font-size:13px;
                             padding:10px 14px;resize:vertical;"></textarea>
          </div>

          <div style="margin-bottom:14px;">
            <label style="font-size:12px;font-weight:700;color:var(--ut-ink3);display:block;margin-bottom:4px;">
              작성 시각
            </label>
            <input type="datetime-local" name="created_at" value="{{ now }}" required
                   style="height:44px;border:1px solid var(--ut-line);border-radius:10px;
                          background:var(--ut-panel2);font:inherit;font-size:14px;padding:0 14px;">
          </div>

          <div style="margin-bottom:20px;">
            <label style="font-size:12px;font-weight:700;color:var(--ut-ink3);display:block;margin-bottom:4px;">공개 범위</label>
            <select name="visibility"
                    style="width:100%;height:44px;border:1px solid var(--ut-line);border-radius:10px;
                           background:var(--ut-panel2);font:inherit;font-size:14px;color:var(--ut-ink);padding:0 12px;">
              <option value="public">🌐 공개</option>
              <option value="private">🔒 비공개</option>
            </select>
          </div>

          <button type="submit" {% if not authors %}disabled{% endif %}
                  style="width:100%;height:48px;font-size:15px;">올리기</button>
        </form>
      </div>

      {# ── 파도풀 위젯 ── #}
      <div class="ut-card rv" id="padoCard"
           style="background:var(--ut-earth-soft);border-color:var(--ut-earth);">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
          <span style="font-weight:700;font-size:15px;color:var(--ut-ink);">🌊 파도풀</span>
          <span style="font-size:11px;font-weight:600;color:var(--ut-earth-ink);background:var(--ut-earth-soft);
                       border:1px solid var(--ut-earth);border-radius:99px;padding:2px 8px;">개인정보 점검</span>
        </div>
        <p style="font-size:13px;color:var(--ut-ink2);margin:0 0 12px;">올리기 전에, 이 글이 나를 얼마나 드러내는지 봅니다.</p>
        <button type="button" id="padoBtn" class="fx-wave"
                style="background:var(--ut-earth);color:#fff;border:none;border-radius:10px;
                       height:40px;padding:0 18px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;">
          이 글 점검
        </button>
        <div id="padoOut" style="margin-top:14px;font-size:14px;"></div>
      </div>
    </div>
  </main>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/pado.js"></script>
<script>
padoWidget({
  btn: document.getElementById("padoBtn"),
  out: document.getElementById("padoOut"),
  getText: () => document.getElementById("body").value
});
</script>
{% endblock %}

# Ubuntu: /etc/nginx/sites-available/veilo · Amazon Linux: /etc/nginx/conf.d/veilo.conf — 80 → Veilo(:3000). 도메인 veilo.site(가비아, 9/16). 443 은 certbot --nginx 가 이 파일에 직접 써 넣는다
server {
    listen 80 default_server;
    server_name veilo.site www.veilo.site;
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;       # 점검은 3~8초, Claude 리라이트는 DEMO_EXTERNAL_TIMEOUT(기본 8초) 상한
    }
}

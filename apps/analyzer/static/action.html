<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>3화면 — 조치</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<h1>3화면 — 조치 추천</h1>
<nav>
  <a href="/static/scan.html">스캔</a>
  <a href="/static/diagnosis.html">진단</a>
  <a href="/static/action.html">조치</a>
</nav>

<div id="content">불러오는 중...</div>
<footer id="badge"></footer>

<script src="/static/common.js"></script>
<script>
showEngineBadge("badge");

const BURDEN_LABEL = { low: "낮음", medium: "보통", high: "높음" };
const ACTION_LABEL = { unpublish: "비공개 전환", activity_meta: "활동 메타 수정", rewrite: "표현 리라이트" };

function targetLabel(t, posts) {
  if (t.kind === "post") return `「${postLabel(posts[t.ref]) || t.ref}」`;
  if (t.kind === "meta_field" && t.ref === "geo_tag") return "위치태그";
  return `${t.kind}:${t.ref}`;
}

function renderActions(actions, data) {
  const posts = Object.fromEntries((data.posts || []).map(p => [p.post_id, p]));
  if (!actions.length) {
    // 목표(기본 40)보다 이미 낮으면 조치가 비는 게 정상이다 — 빈 화면 대신 이유를 보여 준다 (#319 리뷰 1번)
    const r = data.stage2.output.recommendation.projected;
    const target = (data.stage2.input && data.stage2.input.risk && data.stage2.input.risk.target);
    if (r.target_met && target !== undefined && target !== null) {
      return `<p>지금 위험 점수 ${esc(r.current_risk)}가 목표 ${esc(target)}보다 낮아 <b>추가 조치가 필요하지 않습니다.</b>
        더 줄이고 싶으면 아래 「어떤 글부터 내리면 좋을까」와 「표현 바꿔 쓰기」를 참고하세요.</p>`;
    }
    return "<p>추천할 조치가 없습니다.</p>";
  }
  return actions.map(a => `
    <div class="card">
      <b>${esc(ACTION_LABEL[a.action_type] || a.action_type)}</b>
      <span class="badge">부담 ${esc(BURDEN_LABEL[a.burden] || a.burden)}</span>
      <p>대상: ${a.targets.map(t => esc(targetLabel(t, posts))).join(", ")}</p>
      <p>예상 변화: ${esc(a.projected_delta)}</p>
      ${a.rationale ? `<p><i>${esc(a.rationale)}</i></p>` : ""}
    </div>
  `).join("");
}

// 바꿔 쓰기 후보 — 원문 문장에 끼워 보여 준다 (조사까지 맞춘 표현이 suggestion 에 들어 있다)
function renderRewrites(data) {
  const rws = data.stage2.output.rewrites || [];
  if (!rws.length) return "";
  const groups = new Map();
  for (const r of rws) {
    const key = `${r.post_id}|${r.span_id}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  }
  const posts = Object.fromEntries(data.posts.map(p => [p.post_id, p]));
  const cards = [];
  for (const [key, list] of groups) {
    const [postId, spanId] = key.split("|");
    const span = ((data.spans[postId] || { spans: [] }).spans).find(s => s.span_id === spanId);
    const post = posts[postId];
    if (!span || !post) continue;
    const text = (channelsOf(post).find(([tid]) => tid === span.text_id) || [null, ""])[1];
    const before = cpSlice(text, Math.max(0, span.start - 25), span.start);
    const after = cpSlice(text, span.end, span.end + 25);
    const options = list.map(r => `
      <div class="rewrite">…${esc(before)}<mark>${esc(r.suggestion)}</mark>${esc(after)}…
        <span class="note">${r.residual_risk === "none" ? "단서가 사라집니다" : "단서가 약해지지만 남습니다"}</span></div>`).join("");
    cards.push(`<div class="card"><p><del>${esc(span.text)}</del> 대신</p>${options}</div>`);
  }
  return `<h3>표현 바꿔 쓰기</h3>
    <p class="note">확실하지 않으면 후보를 내지 않습니다. 후보가 없는 단서는 아래 「직접 고쳐 볼 표현」을 참고하세요.</p>${cards.join("")}`;
}

// 바꿔 쓰기 후보가 없는 내 단서 — 유형별로 어떻게 고치면 되는지 안내한다.
// 직업 · 장소 단서는 규칙으로 안전하게 바꿀 말이 거의 없고, 로컬 모델로 만든 후보는 새 글에서 good 37% 라 넣지 않았다 (exp21 · 10/9).
// 「후보 없음」으로 끝내지 않고 고칠 방향을 보여 준다
const MANUAL_TIP = {
  JOB: "업종 · 가게나 회사 이름, 하는 일의 세부(쓰는 도구 · 업무 이름)는 「일하는 곳」 「일」 정도로 넓혀 보세요.",
  REL_WORK: "회사 근처 장소나 사내 시설 이름은 「회사 근처」처럼 넓혀 보세요.",
  REL_HOME: "집 근처 가게 · 건물 이름은 「동네 가게」 「집 근처」처럼 바꿔 보세요.",
  LOC_FACILITY: "가게 · 공원 · 학교 이름 대신 「근처 공원」 「한 카페」처럼 종류만 남겨 보세요.",
  LOC_ADMIN: "동 · 구 이름은 시나 도 단위로 넓혀 보세요.",
  AGE: "나이는 「30대」처럼 범위로 바꾸거나 빼 보세요.",
  FAM: "몇째인지, 가족의 나이 · 학년 같은 구성은 「가족」 「아이」처럼 넓혀 보세요.",
  COMMUTE: "노선 · 정류장 · 걸리는 시간은 빼거나 「버스로」 정도만 남겨 보세요.",
  INCOME: "금액 · 대출이나 수당 종류는 빼거나 「돈」 「비용」처럼 넓혀 보세요.",
  SEX: "호칭(언니 · 오빠 · 남편 등)은 성별을 짐작하게 하는 단서가 될 수 있습니다. 「가족」 「친구」로 바꿔도 뜻이 통하는지 보세요.",
};

function renderManualTips(data) {
  const withCandidate = new Set((data.stage2.output.rewrites || []).map(r => `${r.post_id}|${r.span_id}`));
  const posts = Object.fromEntries((data.posts || []).map(p => [p.post_id, p]));
  const byType = new Map();
  for (const [postId, entry] of Object.entries(data.spans || {})) {
    for (const s of (entry.spans || [])) {
      if (s.subject === "other" || withCandidate.has(`${postId}|${s.span_id}`) || !MANUAL_TIP[s.type]) continue;
      if (!byType.has(s.type)) byType.set(s.type, []);
      byType.get(s.type).push({ text: s.text, post: posts[postId], postId });
    }
  }
  if (!byType.size) return "";
  const cards = [...byType].map(([type, list]) => {
    const seen = new Set();
    const uniq = list.filter(x => !seen.has(x.text) && seen.add(x.text));  // 같은 표현은 한 번만
    const items = uniq.slice(0, 6)
      .map(x => `<li><mark>${esc(x.text)}</mark> — 「${esc(postLabel(x.post) || x.postId)}」</li>`).join("");
    const more = uniq.length > 6 ? `<p class="note">외 ${uniq.length - 6}개</p>` : "";
    return `<div class="card"><b>${esc(TYPE_LABEL[type] || type)}</b><p>${esc(MANUAL_TIP[type])}</p><ul>${items}</ul>${more}</div>`;
  }).join("");
  return `<h3>직접 고쳐 볼 표현</h3>
    <p class="note">자동으로 바꿀 말을 정하기 어려운 단서입니다. 유형별로 고치는 방향을 참고해 직접 다듬어 주세요.</p>${cards}`;
}

// 비공개 순서와 후보 수 — 엔진이 글별 k 를 줄 때만
function renderUnpublishPath(data) {
  const kp = data.k_by_post;
  if (!kp || kp.k === null || !kp.greedy.length) return "";
  const posts = Object.fromEntries(data.posts.map(p => [p.post_id, p]));
  const steps = kp.greedy.map(g => `<li>「${esc(postLabel(posts[g.remove]) || g.remove)}」 비공개 → 후보 ${fmtK(g.k_after)}</li>`).join("");
  // 기준이 위 「추천 조치」(위험 점수)와 달라 1순위가 다를 수 있다 — 화면에 기준을 적는다 (#299 리뷰)
  return `<h3>어떤 글부터 내리면 좋을까 <small>— 후보 수 기준</small></h3>
    <div class="card"><p>나와 같은 조건의 사람(후보)이 빨리 늘어나는 순서입니다. 위 「추천 조치」는 위험 점수 기준이라 순서가 다를 수 있습니다.</p>
    <p>지금 후보 ${fmtK(kp.k)}</p><ol>${steps}</ol></div>`;
}

async function rescan(user_ref) {
  const r = await fetch(`/scan/${encodeURIComponent(user_ref)}`, { method: "POST" });
  if (!r.ok) return;
  saveScan(await r.json());
  render();
}

function render() {
  const data = loadScan();
  const el = document.getElementById("content");
  if (!data) {
    el.innerHTML = `<p class="error">스캔 결과가 없습니다. <a href="/static/scan.html">스캔 화면</a>에서 먼저 스캔하세요.</p>`;
    return;
  }
  const rec = data.stage2.output.recommendation;
  el.innerHTML = `
    <h2>${esc(data.user_ref)}</h2>
    <p class="card">위험 점수 <b>${esc(rec.projected.current_risk)} → ${esc(rec.projected.projected_risk)}</b>
      (감소 ${rec.projected.reduction_pct === null || rec.projected.reduction_pct === undefined ? "—" : esc(rec.projected.reduction_pct) + "%"}, 목표 달성: ${rec.projected.target_met ? "예" : "아니오"})</p>
    <h3>추천 조치 <small>— 위험 점수 기준</small></h3>
    ${renderActions(rec.actions, data)}
    ${renderUnpublishPath(data)}
    ${renderRewrites(data)}
    ${renderManualTips(data)}
    <p>비공개 전환은 가상 SNS 쪽 글 화면에서 직접 실행합니다 — 분석기는 '무엇을' 할지만 말합니다.</p>
    <button id="rescanBtn">비공개로 바꾼 뒤 재계산</button>
  `;
  document.getElementById("rescanBtn").onclick = () => rescan(data.user_ref);
}

render();
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>조치 — 파도풀</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">파도풀 <span class="brand-sub">올리기 전에, 내가 몇 명 중 한 명인지</span></div>
    <div class="engine" id="badge"></div>
  </div>
</header>

<nav class="steps">
  <a href="scan.html"><span class="n">1</span>스캔</a>
  <a href="diagnosis.html"><span class="n">2</span>진단</a>
  <a href="action.html" aria-current="step"><span class="n">3</span>조치</a>
</nav>

<main>
<h1>무엇을 어떻게 되돌릴까</h1>
<p class="lede">되돌릴 방법을 부담이 낮은 순으로 추천합니다. 고르는 것은 사용자입니다.</p>
<div id="content">불러오는 중...</div>
</main>

<footer>엔진 판정은 참고용입니다. 최종 판단과 조치는 사용자가 합니다.</footer>

<script src="common.js"></script>
<script>
showEngineBadge("badge");

const BURDEN_LABEL = { low: "낮음", medium: "보통", high: "높음" };
const ACTION_LABEL = { unpublish: "비공개 전환", activity_meta: "활동 메타 수정", rewrite: "표현 리라이트" };

function renderActions(actions) {
  if (!actions.length) return "<p>추천할 조치가 없습니다.</p>";
  return actions.map(a => `
    <div class="card">
      <b>${ACTION_LABEL[a.action_type] || a.action_type}</b>
      <span class="badge">부담 ${BURDEN_LABEL[a.burden] || a.burden}</span>
      <p class="hint">대상: ${a.targets.map(t => `${t.kind}:${t.ref}`).join(", ")}</p>
      <p>예상 변화: ${a.projected_delta}</p>
      ${a.rationale ? `<p><i>${a.rationale}</i></p>` : ""}
    </div>
  `).join("");
}

async function rescan(user_ref) {
  const r = await fetch(`../scan/${encodeURIComponent(user_ref)}`, { method: "POST" });
  if (!r.ok) return;
  saveScan(await r.json());
  render();
}

function render() {
  const data = loadScan();
  const el = document.getElementById("content");
  if (!data) {
    el.innerHTML = `<p class="error">스캔 결과가 없습니다. <a href="scan.html">스캔 화면</a>에서 먼저 스캔하세요.</p>`;
    return;
  }
  const rec = data.stage2.output.recommendation;
  el.innerHTML = `
    <div class="card">
      <h2>${data.user_ref}</h2>
      <p class="score"><b>${rec.projected.current_risk}</b><span class="arrow">→</span>
        <b class="down">${rec.projected.projected_risk}</b>
        <span class="unit">추천 조치를 모두 적용했을 때</span></p>
      <p class="hint">감소 ${rec.projected.reduction_pct} · 목표 ${rec.projected.target_met ? "달성" : "미달"}</p>
    </div>
    <h3>추천 조치</h3>
    ${renderActions(rec.actions)}
    <p class="muted">비공개 전환은 가상 SNS 의 글 화면에서 직접 실행합니다. 이 도구는 「무엇을 할지」까지만 알려 줍니다.</p>
    <button id="rescanBtn">바꾼 뒤 다시 계산</button>
  `;
  document.getElementById("rescanBtn").onclick = () => rescan(data.user_ref);
}

render();
</script>
</body>
</html>

<footer>점검 결과는 참고용입니다. 내용을 확인하고 바꿀 방법을 직접 고르세요.</footer>

<!-- Veilo 모바일 하단 탭바 — base.html 과 같은 세 칸 -->
<nav class="ut-tabs">
  <a data-veilo-href="/"><span class="ic">🏠</span>홈</a>
  <a href="scan.html" class="on"><span class="ic">🌊</span>내 글 점검</a>
  <a data-veilo-href="/new"><span class="ic">✏️</span>글쓰기</a>

<script src="common.js"></script>
<script>
showEngineBadge("badge");

const SNS = window.VEILO_BASE || "";   // Veilo 주소 — head.js (인스턴스는 같은 도메인 루트) · /posts/<id>
const BURDEN = { low: ["낮음", "low"], medium: ["보통", "mid"], high: ["높음 — 내용 변경 큼", "hi"] };
const SURE = { highest: "가장 확실", high: "확실", medium: "단서가 남을 수 있음", low: "효과를 확신하기 어려움" };
// 번호(①②③)는 붙이지 않는다 — 엔진이 부담 순으로 주므로 화면 순서와 어긋날 수 있다 (M3). 아이콘으로 구분
const ACTION = {
  unpublish:     { no: "🔒", nm: "비공개로 바꾸기", how: "Veilo 글 화면 아래 「🔒 비공개로 전환」 버튼을 누릅니다. 삭제가 아니라 언제든 되돌릴 수 있습니다." },
  activity_meta: { no: "📍", nm: "위치 태그 지우기", how: "Veilo 글 화면의 「📍 위치 태그」 칸을 비우고 「위치 저장」을 누릅니다. 본문은 그대로 둡니다." },
  rewrite:       { no: "✏️", nm: "바꿔 쓰기", how: "Veilo 글 화면의 「✏️ 이 글을 옮겨 고쳐 쓰기」를 누르면 본문이 글쓰기 화면으로 옮겨집니다. 아래 표현 중 하나를 골라 그 부분만 고쳐 새 글로 올린 뒤, 원래 글은 비공개로 바꾸세요. 바꾼 뒤 말투와 뜻이 맞는지 확인하세요." },
};
// 파일 업로드 결과 — 글이 Veilo 에 없어 실행 위치를 글을 올린 서비스로 안내한다 (B3)
const ACTION_HOW_UPLOAD = {
  unpublish: "글을 올린 서비스에서 이 글을 비공개로 바꿉니다.",
  activity_meta: "글을 올린 서비스에서 이 글의 위치 정보를 지웁니다.",
  rewrite: "아래 표현 중 하나를 골라 글을 올린 서비스에서 그 부분만 고쳐 씁니다. 바꾼 뒤 말투와 뜻이 맞는지 확인하세요.",
};
const AXIS = { location: "거주지", age: "나이", sex: "성별", occupation: "직업", family: "가족", commute: "통근", income: "소득" };
const fmtN = (n) => Math.round(n).toLocaleString("ko-KR");
const fmtR = (r) => (r === null || r === undefined) ? "—" : Number(r).toFixed(1);

// ── 데이터 보조 ─────────────────────────────────────
function postsOf(data) { return Object.fromEntries((data.posts || []).map(p => [p.post_id, p])); }
function spanOf(data, postId, spanId) {
  return ((data.spans[postId] || { spans: [] }).spans).find(s => s.span_id === spanId);
}
function spanTexts(data, postId, ids) {
  return (ids || []).map(id => spanOf(data, postId, id)).filter(Boolean).filter(s => s.subject !== "other").map(s => s.text);
}
function mySpans(data, postId) {
  return ((data.spans[postId] || { spans: [] }).spans).filter(s => s.subject !== "other");
}
function contribOf(data, postId) {
  return ((data.contribution.output.contributions) || []).find(c => c.post_id === postId);
}
function kWithout(data, postId) {
  const kp = data.k_by_post; if (!kp || kp.k === null) return null;
  const row = (kp.per_post || []).find(r => r.post_id === postId);
  return row ? row.k_without : null;
}
// 조치별 「바꾸면 k」 — k_by_action (server.py · 계약 밖 화면 전용). 비공개(k_by_post)와 같은 k 계산이다
function kAfterAction(data, type) {
  const ka = data.k_by_action; if (!ka || ka.k === null || ka.k === undefined) return null;
  const v = (ka.by_action || {})[type];
  return v === undefined ? null : v;
}
function kAfterSpan(data, postId, spanId) {
  const ka = data.k_by_action; if (!ka || ka.k === null || ka.k === undefined) return null;
  const row = (ka.by_span || []).find(r => r.post_id === postId && r.span_id === spanId);
  return row && row.k_after !== undefined ? row.k_after : null;
}
// 「같은 조건의 사람 약 N명 → 약 M명」 — 비공개 카드와 같은 문구. 값은 숫자라 esc 가 필요 없지만 fmtN 을 거쳐 문자열로만 넣는다
function kEffect(k, kw, same) {
  if (kw === null || kw === undefined || k === null || k === undefined) return "";
  if (fmtN(kw) === fmtN(k)) return `같은 조건의 사람 수는 그대로 — ${esc(same)}`;
  return `같은 조건의 사람 약 ${esc(fmtN(k))}명 → <b>약 ${esc(fmtN(kw))}명</b>`;
}
function postLink(data, postId) {
  const p = postsOf(data)[postId];
  const label = `「${esc(postLabel(p) || postId)}」`;
  if (isUpload(data)) return label;   // 업로드 글은 Veilo 에 없다 — 링크 대신 제목만 (B3)
  return `<a href="${SNS}/posts/${encodeURIComponent(postId)}">${label}</a>`;   // 같은 탭 — Veilo 안의 한 화면처럼 이어진다
}
// 깔때기 조건 문자열 «텍스트» 에서 단서를 뽑아 어느 글인지 찾는다
function condParts(cond) {
  const quotes = [...cond.matchAll(/«([^»]+)»/g)].map(m => m[1]);
  const tail = cond.match(/→\s*(.+)$/);
  return { quotes, tail: tail ? tail[1] : "" };
}
function findPostByText(data, text) {
  for (const p of data.posts || []) {
    if (mySpans(data, p.post_id).some(s => s.text === text)) return p.post_id;
  }
  return null;
}

// ── 0. 전 → 후 한 줄 — 사람 수로 말하고 노출 위험도는 보조 ─────────
// 「추천대로 하면」의 사람 수는 응답에 비공개 효과만 있다(k_by_post). 비공개 추천 글이 있으면 그 글들을 내린 뒤의 수를
// per_post(한 편) · greedy(앞에서부터 같은 글 묶음)에서 찾고, 못 찾으면(목 · 비공개 추천 없음) 노출 위험도로만 말한다.
// 바꿔 쓰기 · 위치 태그 지우기의 사람 수는 k_by_action 에 있다 (각 조치 카드에 표시)
function kAfterUnpublish(data, ids) {
  const kp = data.k_by_post;
  if (!kp || kp.k === null || !ids.length) return null;
  if (ids.length === 1) {
    const row = (kp.per_post || []).find(r => r.post_id === ids[0]);
    return row ? row.k_without : null;
  }
  const g = (kp.greedy || []).slice(0, ids.length);
  const want = new Set(ids);
  if (g.length === ids.length && g.every(x => want.has(x.remove))) return g[g.length - 1].k_after;
  return kAfterAction(data, "unpublish");   // k 순서와 노출 위험도 순서가 다를 때 — 추천한 글 묶음을 그대로 뺀 k
}
function renderBeforeAfter(data) {
  const rec = data.stage2.output.recommendation;
  const pr = rec.projected;
  const k = data.specificity.output.k;
  const un = rec.actions.find(a => a.action_type === "unpublish");
  const ids = un ? [...new Set(un.targets.map(t => t.ref))] : [];
  const m = kAfterUnpublish(data, ids);
  const risk = rec.actions.length ? `노출 위험도 ${fmtR(pr.current_risk)} → ${fmtR(pr.projected_risk)}` : "";
  let line;
  if (k !== null && k !== undefined && m !== null && m !== undefined && Math.round(m) !== Math.round(k)) {
    line = `지금 <b>${fmtOneOf(k)}</b> <span class="arrow">→</span> 추천한 글 ${ids.length}편을 비공개로 바꾸면 <b class="down">${fmtOneOf(m)}</b>`;
  } else if (k !== null && k !== undefined) {
    line = `지금 <b>${fmtOneOf(k)}</b>${risk ? ` · 추천대로 하면 ${risk}` : ""}`;
  } else {
    line = risk ? `추천대로 하면 ${risk}` : "";
  }
  if (!line) return "";
  const sub = m !== null && m !== undefined && Math.round(m) !== Math.round(k) && risk ? `<p class="hint">추천 방법을 모두 적용하면 ${risk} (예상)</p>` : "";
  return `<div class="card before-after"><p class="ba">${line}</p>${sub}
    <p class="hint">같은 조건의 사람이 많을수록 글쓴이를 좁히기 어렵습니다. 예상값이며 실제로 바꾼 뒤 다시 점검해 확인하세요.</p></div>`;
}

// ── 1. 점수가 무슨 뜻인가 ───────────────────────────
function renderScore(data) {
  const rec = data.stage2.output.recommendation;
  const pr = rec.projected;
  const spec = data.specificity.output;
  const target = data.stage2.input && data.stage2.input.risk ? data.stage2.input.risk.target : null;
  const k = spec.k;
  const axes = spec.risk_by_axis || {};
  const bars = Object.entries(axes).filter(([a]) => AXIS[a]).sort((x, y) => y[1] - x[1]).map(([a, v]) => `
    <li><span class="al">${AXIS[a]}</span><span class="ab"><i style="width:${Math.max(2, v)}%"></i></span><span class="av">${Math.round(v)}</span></li>`).join("");
  return `
    <div class="card">
      <div class="row between">
        <h2>${esc(data.nickname || ((data.posts[0] || {}).activity_meta || {}).nickname || data.user_ref)} <small class="muted">@${esc(data.user_ref)}</small></h2>
        ${isUpload(data)
          ? `<a class="btn ghost" href="scan.html">파일을 고쳐 다시 올리기</a>`
          : `<button id="rescanBtn" class="ghost">Veilo에서 바꾼 뒤 다시 점검</button>`}
      </div>
      <p class="score"><b>${fmtR(pr.current_risk)}</b><span class="arrow">→</span>
        <b class="down">${fmtR(pr.projected_risk)}</b>
        <span class="unit">추천 방법을 모두 적용한 예상 노출 위험도</span></p>
      <p class="hint" style="margin-top:6px">감소 <b>${pr.reduction_pct === null || pr.reduction_pct === undefined ? "—" : fmtR(pr.reduction_pct) + "%"}</b>
        · 지금 같은 조건의 사람 <b>${fmtK(k)}</b>
        ${target !== null && target !== undefined ? `· 목표 노출 위험도 ${fmtR(target)} ${pr.target_met ? "— 추천 방법을 모두 적용하면 목표 이하" : "— 모두 적용해도 목표 초과"}` : ""}</p>
      <details class="more">
        <summary>노출 위험도는 무슨 뜻인가</summary>
        <p class="explain">
          <b>글에 드러난 개인정보 7개 항목(거주지, 나이, 성별, 직업, 가족, 통근(출퇴근), 소득)이 각각 얼마나 구체적으로 드러났는지를 0~100으로 매겨 평균한 값입니다.</b>
          아무것도 드러나지 않으면 0이고, 단서가 구체적일수록 높아집니다. 아래 막대가 항목별 노출 위험도입니다.
          <b>같은 조건의 사람 수와는 따로 계산합니다.</b> 사람 수는 인구통계로 세고, 노출 위험도는 단서가 얼마나 구체적인지로 매깁니다.
          그래서 노출 위험도가 내려가도 사람 수는 그대로일 수 있습니다. 둘 중 하나가 틀린 것은 아닙니다.
          ${target !== null && target !== undefined ? `목표 <b>${fmtR(target)}</b>보다 낮추는 것을 권합니다. 목표보다 낮아도 위험이 완전히 사라지는 것은 아닙니다.` : ""}
          「판단 보류」는 단서를 찾지 못해 추측하지 않은 항목입니다. 파도풀은 실제 나이나 주소를 맞히지 않고, 좁혀질 수 있는지만 봅니다.
        </p>
        ${bars ? `<h4>개인정보 항목별 노출 위험도 <small>— 100 = 해당 항목만으로 거의 특정</small></h4><ul class="axes">${bars}</ul>` : ""}
      </details>
    </div>`;
}

// ── 2. 어떻게 좁혀지나 — 깔때기 ────────────────────
function renderFunnel(data) {
  const steps = (data.specificity.output.steps || []);
  if (steps.length < 2) return "";
  const nation = steps[0].n_after;
  const lis = steps.map((s, i) => {
    const { quotes, tail } = condParts(s.condition);
    const w = Math.max(1.5, 100 * Math.log10(s.n_after + 1) / Math.log10(nation + 1));
    let desc, src = "";
    if (i === 0) { desc = "전 국민"; src = "행정안전부 주민등록 인구"; }
    else {
      desc = `${AXIS[s.axis] || "기타"}${tail ? ` — ${esc(placeName(data, tail))}` : ""}`;
      // «…» 가 행정코드뿐이면 글에서 찾은 지명으로 바꿔 보인다 — 코드를 화면에 내지 않는다
      const where = quotes.map(q0 => { const q = placeName(data, q0); const pid = findPostByText(data, q); return `「${esc(q)}」${pid ? ` <span class="src">${postLink(data, pid)}</span>` : ""}`; }).join(" · ");
      const how = s.method === "ratio_damped"
        ? `비율로 추정한 사람 수 — 기준값 ${s.confidence}` : "주민등록 인구통계에 따른 사람 수";
      src = `${where}${where ? " · " : ""}<span class="muted">${how}</span>`;
    }
    return `<li><div class="fl"><span class="fd">${desc}</span><span class="fs">${src}</span></div>
      <span class="fk">${fmtN(s.n_after)}명</span><i class="fb" style="width:${w}%"></i></li>`;
  }).join("");
  return `
    <details class="card more sec">
      <summary>어떻게 ${fmtN(steps[steps.length - 1].n_after)}명까지 좁혀지나 <small>— 단서를 하나씩 더할 때 같은 조건의 사람 수</small></summary>
      <p class="hint">각 줄은 단서를 하나씩 더했을 때 같은 조건에 해당하는 사람 수입니다. 이름과 전화번호가 없어도 여러 단서를 모으면 글쓴이를 좁힐 수 있습니다. 단서를 지우거나 넓게 바꾸면 위험을 줄일 수 있습니다.</p>
      <ul class="funnel">${lis}</ul>
    </details>`;
}

// ── 3. 조치 — 무엇을 · 어떻게 · 왜 ─────────────────
function renderActions(data) {
  const rec = data.stage2.output.recommendation;
  const posts = postsOf(data);
  const cur = rec.projected.current_risk;
  const k = data.specificity.output.k;
  if (!rec.actions.length) {
    // 목표(기본 40)보다 이미 낮으면 조치가 비는 게 정상이다 — 빈 화면 대신 이유를 보여 준다 (#319 리뷰 1번)
    // 계정·연락처가 남아 있으면 「필요 없음」이라고 하지 않는다 — 위의 「먼저 지울 것」이 남은 조치다 (#326)
    const target = data.stage2.input && data.stage2.input.risk ? data.stage2.input.risk.target : null;
    const strong = strongIdentifiers(data).length;
    let msg;
    // 안전을 단정하지 않는다 — 「필요 없음」이 아니라 「추천할 방법이 없음」 + 한 번 점검의 한계 한 줄
    const limit = `<p class="hint">이번 점검은 지금 공개된 글만 봤습니다. 새 글을 쓰거나 다른 곳의 글과 함께 보면 결과가 달라질 수 있습니다.</p>`;
    if (rec.projected.target_met && target !== null && target !== undefined) {
      msg = strong
        ? `노출 위험도 ${fmtR(cur)}는 목표 ${fmtR(target)}보다 낮습니다. 그래도 <b>위의 「먼저 지울 것」은 지우는 것을 권합니다.</b> 노출 위험도와 상관없이 계정이나 연락처로 바로 이어집니다.`
        : `현재 노출 위험도 ${fmtR(cur)}가 목표 ${fmtR(target)}보다 낮아 <b>추가로 추천할 방법이 없습니다.</b> 더 줄이고 싶으면 아래 「어떤 글부터」를 참고하세요.`;
    } else {
      msg = `추천할 방법이 없습니다.${strong ? " 위의 「먼저 지울 것」은 지우는 것을 권합니다." : ""}`;
    }
    return `<h3>추천 방법</h3><div class="card"><p>${msg}</p>${limit}</div>`;
  }
  const cards = rec.actions.map(a => {
    const A0 = ACTION[a.action_type] || { no: "", nm: "기타 방법", how: "" };
    const A = isUpload(data) && ACTION_HOW_UPLOAD[a.action_type] ? { ...A0, how: ACTION_HOW_UPLOAD[a.action_type] } : A0;
    const [bl, bc] = BURDEN[a.burden] || [a.burden, ""];
    const after = cur + (a.projected_delta || 0);
    let what = "", why = "";

    if (a.action_type === "unpublish") {
      what = `<ul class="targets">${a.targets.map(t => {
        const c = contribOf(data, t.ref); const kw = kWithout(data, t.ref);
        const clues = spanTexts(data, t.ref, c ? c.clue_ids : mySpans(data, t.ref).map(s => s.span_id));
        return `<li>${postLink(data, t.ref)}
          ${clues.length ? `<div class="clues">드러나는 단서: ${clues.map(x => `<mark>${esc(x)}</mark>`).join(" ")}</div>` : ""}
          <div class="eff">이 글을 비공개로 바꾸면 노출 위험도 ${fmtR(cur)} → <b>${c ? fmtR(c.risk_without) : "—"}</b>${
            kw === null || k === null ? ""
            : fmtN(kw) === fmtN(k) ? ` · 같은 조건의 사람 수는 그대로 — 같은 단서가 다른 글에도 있습니다`   // E 리뷰: 「15,069 → 15,069」 는 헷갈린다
            : ` · 같은 조건의 사람 약 ${fmtN(k)}명 → <b>약 ${fmtN(kw)}명</b>`}</div></li>`;
      }).join("")}</ul>`;
      // 사람 수와 노출 위험도는 따로 계산한다 — 인과로 묶지 않는다 (M1)
      why = `이 단서들이 글쓴이를 좁히는 조건입니다. 비공개로 바꾼 글은 다음 점검에서 빠집니다. 남은 글의 단서에 따라 같은 조건의 사람 수나 노출 위험도가 달라질 수 있습니다. 글은 지워지지 않고 비공개로만 바뀝니다.`;
    } else if (a.action_type === "activity_meta") {
      // 위치 태그는 export 계약대로 activity_meta.geo_tag (B4). 위에서 비공개로 바꾸라고 한 글은 빼고 남은 글만
      const hidden = new Set(rec.actions.filter(x => x.action_type === "unpublish").flatMap(x => x.targets.map(t => t.ref)));
      const all = (data.posts || []).filter(p => geoTagOf(p));
      const tagged = all.filter(p => !hidden.has(p.post_id));
      what = tagged.length
        ? `<ul class="targets">${tagged.map(p => `<li>${postLink(data, p.post_id)} <span class="geochip">📍 ${esc(geoTagOf(p))}</span></li>`).join("")}</ul>${
            all.length > tagged.length ? `<p class="muted">비공개로 바꾸라고 한 글 ${all.length - tagged.length}편은 뺐습니다.</p>` : ""}`
        : all.length ? `<p class="muted">위치 태그가 붙은 글은 모두 위에서 비공개로 바꾸라고 한 글입니다.</p>`
        : `<p class="muted">위치 태그가 붙은 글이 없습니다.</p>`;
      const km = kEffect(k, kAfterAction(data, "activity_meta"), "본문의 다른 단서로 이미 좁혀집니다");
      if (tagged.length && km) what += `<div class="eff">위치 태그를 모두 지우면 ${km}</div>`;
      why = `위치 태그도 사는 곳을 짐작할 단서가 됩니다. 본문을 고쳐도 위치 태그가 남아 있으면 같은 정보를 드러낼 수 있습니다.${a.projected_delta === 0 ? " 지금은 본문에 같은 동네가 이미 드러나 있어 노출 위험도 변화가 0으로 나옵니다. 본문을 고친 뒤에는 이 태그가 마지막 단서로 남습니다." : ""}`;
    } else if (a.action_type === "rewrite") {
      const n = a.targets.length;
      what = `<p>글 ${n}편에 직접 쓴 정보 — ${a.targets.slice(0, 4).map(t => postLink(data, t.ref)).join(", ")}${n > 4 ? ` 외 ${n - 4}편` : ""}. <a href="#rewrites">바꿔 쓸 표현 보기 ↓</a></p>`;
      const kr = kEffect(k, kAfterAction(data, "rewrite"), "다른 글의 단서로 이미 좁혀집니다");
      if (kr) what += `<div class="eff">직접 쓴 정보를 모두 고치면 ${kr}</div>`;
      why = `숫자 나이나 동네 이름처럼 직접 쓴 정보를 넓은 말로 바꾸면 그 문장이 글쓴이를 좁히는 폭이 줄어듭니다. 효과는 단서를 모두 고쳤을 때 기준이고, 「단서가 남음」 표시가 있는 표현은 단서가 약해지지만 남습니다.`;
    } else {
      what = `<p>${a.targets.map(t => t.kind === "post" ? postLink(data, t.ref) : esc(t.ref)).join(", ")}</p>`;
    }

    return `
    <div class="card act">
      <div class="act-head">
        <span class="nm">${A.no} ${esc(A.nm)}</span>
        <span class="pill b-${bc}">부담 ${esc(bl)}</span>
        <span class="pill sure">${esc(SURE[a.certainty] || a.certainty || "")}</span>
        <span class="delta">노출 위험도 ${fmtR(cur)} → <b>${fmtR(after)}</b> <small>(${a.projected_delta > 0 ? "+" : ""}${fmtR(a.projected_delta)})</small></span>
      </div>
      <div class="what">${what}</div>
      <details class="more">
        <summary>어떻게 하고, 왜 노출 위험도가 내려가나</summary>
        ${a.rationale ? `<p class="rationale">${esc(uiText(a.rationale))}</p>` : ""}
        <h4>어떻게</h4><p>${esc(A.how)}</p>
        <h4>왜 노출 위험도가 내려가나</h4><p>${why}</p>
      </details>
    </div>`;
  }).join("");
  return `
    <h3>추천 방법 <small>— 부담이 낮은 것부터. 모두 할 필요는 없습니다</small></h3>
    ${cards}
    <p class="note">모두 적용한 예상 노출 위험도 <b>${fmtR(cur)} → ${fmtR(rec.projected.projected_risk)}</b>, 목표 ${rec.projected.target_met ? "달성" : "미달"}.
      예상값은 그 방법을 적용한 상태로 다시 센 값이라 단순 합과 다를 수 있습니다. ${isUpload(data) ? "실제 변경은 글을 올린 서비스에서 직접 합니다." : "실제 변경은 Veilo의 해당 글에서 직접 합니다."}</p>`;
}

// ── 4. 어떤 글부터 ──────────────────────────────────
function renderOrder(data) {
  const gp = (data.contribution.output.greedy_path || []);
  const kg = (data.k_by_post && data.k_by_post.greedy) || [];
  if (!gp.length) return "";
  const cur = data.contribution.output.baseline_risk;
  const k = data.specificity.output.k;
  let prev = cur;
  const rows = gp.map((g, i) => {
    const kk = kg[i] && kg[i].remove === g.remove ? kg[i].k_after : null;
    const row = `<li>${postLink(data, g.remove)}
      <span class="eff">노출 위험도 ${fmtR(prev)} → <b>${fmtR(g.risk_after)}</b>${kk !== null ? ` · 같은 조건의 사람 약 ${fmtN(kk)}명` : ""}</span></li>`;
    prev = g.risk_after; return row;
  }).join("");
  return `
    <details class="card more sec">
      <summary>어떤 글부터 비공개로 바꿀까 <small>— 한 편씩 바꿀 때 노출 위험도가 가장 빨리 내려가는 순서</small></summary>
      <p class="hint">위 「🔒 비공개로 바꾸기」와 같은 계산입니다. 앞의 글을 비공개로 바꾼 뒤 다시 계산한 예상 효과입니다.${k !== null ? ` 지금 같은 조건의 사람 약 ${fmtN(k)}명.` : ""}</p>
      <ol class="order">${rows}</ol>
    </details>`;
}

// ── 5. 표현 바꿔 쓰기 ───────────────────────────────
function renderRewrites(data) {
  const rws = data.stage2.output.rewrites || [];
  if (!rws.length) return "";
  const groups = new Map();
  for (const r of rws) {
    const key = `${r.post_id}|${r.span_id}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  }
  const posts = postsOf(data);
  const cards = [];
  for (const [key, list] of groups) {
    const [postId, spanId] = key.split("|");
    const span = spanOf(data, postId, spanId);
    const post = posts[postId];
    if (!span || !post) continue;
    const text = (channelsOf(post).find(([tid]) => tid === span.text_id) || [null, ""])[1];
    const before = cpSlice(text, Math.max(0, span.start - 25), span.start);
    const after = cpSlice(text, span.end, span.end + 25);
    const options = list.map(r => `
      <div class="rewrite">…${esc(before)}<mark>${esc(r.suggestion)}</mark>${esc(after)}…
        <span class="note">${r.residual_risk === "none" ? "이 표현의 단서가 사라집니다" : "단서가 남음 — 단서가 약해지지만 남습니다"}</span></div>`).join("");
    // 사람 수는 그 스팬을 「완전히 지웠을 때」(k_by_action.by_span) — 「단서가 남음」 후보의 실제 효과보다 크다(상한). 그렇다고 적는다 (Codex 10/14)
    const ks = kEffect(data.specificity.output.k, kAfterSpan(data, postId, spanId), "다른 단서로 이미 좁혀집니다");
    cards.push(`<div class="card"><p class="rw-head">${postLink(data, postId)} 에서 <del>${esc(span.text)}</del> <span class="muted">(${esc(TYPE_LABEL[span.type] || span.type)})</span> 대신</p>${
      ks ? `<div class="eff">이 표현의 단서를 완전히 지우면 ${ks}${list.some((r) => r.residual_risk !== "none") ? `<span class="muted"> · 최대로 잡은 값입니다 — 아래 「단서가 남음」 표현으로 바꾸면 효과는 이보다 작습니다</span>` : ""}</div>` : ""}${options}
      ${isUpload(data) ? "" : `<p class="go"><a class="btn" href="${SNS}/posts/${encodeURIComponent(postId)}#fix">Veilo에서 이 글 고쳐 쓰기 →</a></p>`}</div>`);
  }
  if (!cards.length) return "";
  return `<details class="more sec" id="rewrites">
    <summary>바꿔 쓰기 <small>— 바꿔 쓸 표현이 있는 ${cards.length}곳</small></summary>
    <p class="note">확실하지 않으면 표현을 추천하지 않습니다. 추천 표현이 없는 단서는 아래 「직접 고쳐 볼 표현」을 참고하세요. 더 넓은 표현으로 바꾸면 원래 뜻도 달라질 수 있습니다.</p>${cards.join("")}
  </details>`;
}

// ── 6. 직접 고쳐 볼 표현 — 바꿔 쓰기 후보가 없는 내 단서 (#329) ──
// 직업 · 장소 단서는 규칙으로 안전하게 바꿀 말이 거의 없고, 로컬 모델로 만든 후보는 새 글에서 good 37% 라 넣지 않았다 (exp21 · 10/9).
// 「후보 없음」으로 끝내지 않고 고칠 방향을 보여 준다
const MANUAL_TIP = {
  JOB: "업종이나 가게, 회사 이름 대신 「일하는 곳」처럼 써 보세요. 업무 이름과 도구도 구체적으로 적었는지 확인하세요.",
  REL_WORK: "회사 근처 장소나 사내 시설 이름은 「회사 근처」처럼 넓혀 보세요.",
  REL_HOME: "집 근처 가게나 건물 이름은 「동네 가게」나 「집 근처」처럼 바꿔 보세요.",
  LOC_FACILITY: "가게나 공원, 학교 이름 대신 「근처 공원」이나 「한 카페」처럼 종류만 써 보세요.",
  LOC_ADMIN: "동이나 구 이름 대신 시나 도 이름을 써 보세요.",
  AGE: "나이는 「30대」처럼 넓게 쓰거나 빼 보세요.",
  FAM: "몇째인지, 나이나 학년을 적는 대신 「가족」이나 「아이」로 써도 뜻이 통하는지 보세요.",
  COMMUTE: "노선이나 정류장 이름, 걸리는 시간은 빼고 「버스로」 정도만 써 보세요.",
  INCOME: "금액이나 대출, 수당의 종류는 빼거나 「돈」, 「비용」처럼 넓게 써 보세요.",
  SEX: "「언니」, 「오빠」, 「남편」 같은 호칭은 성별 단서가 될 수 있습니다. 「가족」이나 「친구」로 바꿔도 뜻이 통하는지 보세요.",
};

// 표현에서 끝 조사를 떼 같은 말끼리 묶는다 — 「할멈과 · 할멈이 · 할멈은」 → 「할멈」 (#329 리뷰 2번)
const _TAIL_PARTICLES = ["하고는", "에게서", "이랑", "하고", "에서", "에게", "한테", "께서", "까지", "부터", "으로", "이나",
  "은", "는", "이", "가", "을", "를", "과", "와", "에", "께", "랑", "로", "의", "도", "만", "나"];
const _ONE_CHAR_KIN = new Set(["딸", "형", "처", "애", "손"]);  // 한 글자라도 진짜 단서인 가족 호칭
function _core(text) {
  let t = String(text || "").trim().replace(/[\s.,!?…~'"“”‘’()\[\]]+$/u, "");
  for (const p of _TAIL_PARTICLES) {
    if (t.endsWith(p) && (t.length > p.length + 1 || _ONE_CHAR_KIN.has(t.slice(0, -p.length)))) { t = t.slice(0, -p.length); break; }
  }
  return t;
}
// 조각 — 두 글자 미만이거나 어미·조사로 시작하는 말(「으러」 「며」)은 1단의 잘린 조각이라 보여 주지 않는다 (#329 리뷰 1번)
const _FRAGMENT = /^(?:으|러|며|고서|면서|는데|은데|니까|어서|아서|이랑|하고)/u;
function _isFragment(core) {
  return core.length === 0 || (core.length < 2 && !_ONE_CHAR_KIN.has(core)) || _FRAGMENT.test(core);
}

function renderManualTips(data) {
  const withCandidate = new Set((data.stage2.output.rewrites || []).map(r => `${r.post_id}|${r.span_id}`));
  const posts = postsOf(data);
  const byType = new Map();
  const inferred = new Map();  // 추론 단서는 「30대처럼」 같은 고칠 방향이 맞지 않아 개수만 따로 (#329 리뷰 3번)
  for (const [postId, entry] of Object.entries(data.spans || {})) {
    for (const s of (entry.spans || [])) {
      if (s.subject === "other" || withCandidate.has(`${postId}|${s.span_id}`) || !MANUAL_TIP[s.type]) continue;
      const core = _core(s.text);
      if (_isFragment(core)) continue;
      if (s.level === "inferential") { inferred.set(s.type, (inferred.get(s.type) || 0) + 1); continue; }
      if (!byType.has(s.type)) byType.set(s.type, new Map());
      const group = byType.get(s.type);
      if (!group.has(core)) group.set(core, { core, posts: new Set(), first: postId });
      group.get(core).posts.add(postId);
    }
  }
  if (!byType.size && !inferred.size) return "";
  let nItems = 0;
  const cards = [...byType].map(([type, group]) => {
    const list = [...group.values()].sort((a, b) => b.posts.size - a.posts.size);
    nItems += list.length;
    const items = list.slice(0, 6).map(g => {
      const where = g.posts.size > 1 ? `글 ${g.posts.size}편` : postLink(data, g.first);
      return `<li><mark>${esc(g.core)}</mark> — ${where}</li>`;
    }).join("");
    const more = list.length > 6 ? `<p class="note">외 ${list.length - 6}개</p>` : "";
    const inf = inferred.get(type) ? `<p class="note">여러 정황으로 짐작되는 단서 ${inferred.get(type)}개는 「점검 결과」에서 글과 함께 확인하세요.</p>` : "";
    inferred.delete(type);
    return `<div class="card tip"><b>${esc(TYPE_LABEL[type] || type)}</b><p>${esc(MANUAL_TIP[type])}</p><ul>${items}</ul>${more}${inf}</div>`;
  }).join("");
  const restInf = [...inferred].map(([type, n]) => `${esc(TYPE_LABEL[type] || "기타 단서")} ${n}개`).join(", ");
  const rest = restInf ? `<p class="note">여러 정황으로 짐작되는 단서(${restInf})는 「점검 결과」에서 글과 함께 확인하세요.</p>` : "";
  return `<details class="more sec">
    <summary>직접 고쳐 볼 표현 <small>— 추천 표현이 없는 단서 ${nItems}개, 직접 고치는 방법</small></summary>
    <p class="note">바꿔 쓸 표현을 추천하기 어려운 단서입니다. 유형별 방법을 참고해 직접 다듬어 주세요.</p>${cards}${rest}
  </details>`;
}

// 다시 점검 — Veilo 계정만 (업로드 결과의 user_ref 는 Veilo 에 없어 404 가 난다 · B3).
// 네트워크 오류에도 버튼을 되살린다 (B4). 이름 · 출처는 새 결과에도 이어 붙인다
async function rescan(prev) {
  const b = document.getElementById("rescanBtn");
  if (b) { b.disabled = true; b.textContent = "다시 점검하는 중…"; }
  // 내 글 점검 화면과 같은 진행 띠 (UX #31) · 예상 시간은 서버 어림(못 받으면 없이)
  let est;
  try { const r = await fetch(`../sns/estimate/${encodeURIComponent(prev.user_ref)}`); if (r.ok) est = (await r.json()).seconds; } catch { /* 예상 없이 */ }
  progressStart(`${prev.nickname || prev.user_ref} 다시 점검 중`, null, est);
  try {
    const r = await fetch(`../scan/${encodeURIComponent(prev.user_ref)}`, { method: "POST" });
    if (!r.ok) {
      // 서버의 한국어 사유(429 「지금 다른 점검이 진행 중입니다…」 등)를 버튼에 그대로 — 상태 코드는 내지 않는다
      const detail = (await r.json().catch(() => ({}))).detail;
      const err = new Error(String(r.status)); err.detail = typeof detail === "string" ? detail : ""; throw err;
    }
    const data = await r.json();
    data.nickname = prev.nickname; data.source = "veilo";
    saveScan(data);
    render();
  } catch (e) {
    if (b) { b.disabled = false; b.textContent = e && e.detail ? `${e.detail} (다시 누르기)` : "다시 점검하지 못했습니다. 다시 누르기"; }
  } finally { progressStop(); }
}

function render() {
  const data = loadScan();
  const el = document.getElementById("content");
  if (!data) {
    el.innerHTML = `<p class="error">점검 결과가 없습니다. <a href="scan.html">「내 글 점검」</a>에서 먼저 점검해 주세요.</p>`;
    return;
  }
  el.innerHTML = renderBeforeAfter(data) + renderScore(data)
    + renderDirectIdentifiers(data, "먼저 지울 것 — 계정이나 연락처로 바로 이어지는 정보")   // #326 · 점수와 별개
    + renderTimeline(data)   // #331 · 점수와 별개
    + renderActions(data) + renderFunnel(data) + renderOrder(data) + renderRewrites(data) + renderManualTips(data);
  const rb = document.getElementById("rescanBtn");
  if (rb) rb.onclick = () => rescan(data);
  // 바꿔 쓰기 카드의 「바꿔 쓸 표현 보기」 링크 → 접힌 섹션을 펼치고 이동
  el.querySelectorAll('a[href="#rewrites"]').forEach(a => a.addEventListener("click", () => { const d = document.getElementById("rewrites"); if (d) d.open = true; }));
}

render();
</script>
</body>
</html>

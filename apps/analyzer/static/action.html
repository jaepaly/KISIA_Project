<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>조치 — 파도풀</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">파도풀 <span class="brand-sub">올리기 전에, 내가 몇 명 중 한 명인지</span></div>
    <a class="back-sns" href="/">🌱 Veilo 로 돌아가기</a>
    <div class="engine" id="badge"></div>
  </div>
</header>

<nav class="steps">
  <a href="scan.html"><span class="n">1</span>스캔</a>
  <a href="diagnosis.html"><span class="n">2</span>진단</a>
  <a href="action.html" aria-current="step"><span class="n">3</span>조치</a>
</nav>

<main>
<h1>무엇을 어떻게 되돌릴까</h1>
<p class="lede">점수가 무슨 뜻인지, 어느 문장이 점수를 올리는지, 어떤 조치를 하면 왜 얼마나 내려가는지를 순서대로 보여줍니다. 실행 버튼은 Veilo 글 화면에 있습니다 — 파도풀은 제안까지만 합니다.</p>
<div id="content">불러오는 중...</div>
</main>

<footer>엔진 판정은 참고용입니다. 최종 판단과 조치는 사용자가 합니다.</footer>

<script src="common.js"></script>
<script>
showEngineBadge("badge");

const SNS = "";   // Veilo 는 같은 도메인의 루트에 있다 — /posts/<id>
const BURDEN = { low: ["낮음", "low"], medium: ["보통", "mid"], high: ["높음 · 글의 뼈대", "hi"] };
const SURE = { highest: "가장 확실", high: "확실", medium: "잔존 단서 가능", low: "효과 불확실" };
const ACTION = {
  unpublish:     { no: "①", nm: "글 비공개",     how: "Veilo 글 화면 아래 「🔒 비공개로 전환」 버튼을 누릅니다. 삭제가 아니라 언제든 되돌릴 수 있습니다." },
  activity_meta: { no: "②", nm: "위치태그 떼기", how: "Veilo 글 화면의 「📍 위치 태그」 칸을 비우고 「위치 저장」을 누릅니다. 본문은 그대로 둡니다." },
  rewrite:       { no: "③", nm: "표현만 바꾸기", how: "아래 후보 중 하나를 골라 Veilo 글 화면에서 그 표현만 고쳐 씁니다. 말투와 내용은 그대로입니다." },
};
const AXIS = { location: "거주지", age: "나이", sex: "성별", occupation: "직업", family: "가족", commute: "통근", income: "소득" };
const fmtN = (n) => Math.round(n).toLocaleString("ko-KR");
const fmtR = (r) => (r === null || r === undefined) ? "—" : Number(r).toFixed(1);

// ── 데이터 보조 ─────────────────────────────────────
function postsOf(data) { return Object.fromEntries((data.posts || []).map(p => [p.post_id, p])); }
function spanOf(data, postId, spanId) {
  return ((data.spans[postId] || { spans: [] }).spans).find(s => s.span_id === spanId);
}
function spanTexts(data, postId, ids) {
  return (ids || []).map(id => spanOf(data, postId, id)).filter(Boolean).filter(s => s.subject !== "other").map(s => s.text);
}
function mySpans(data, postId) {
  return ((data.spans[postId] || { spans: [] }).spans).filter(s => s.subject !== "other");
}
function contribOf(data, postId) {
  return ((data.contribution.output.contributions) || []).find(c => c.post_id === postId);
}
function kWithout(data, postId) {
  const kp = data.k_by_post; if (!kp || kp.k === null) return null;
  const row = (kp.per_post || []).find(r => r.post_id === postId);
  return row ? row.k_without : null;
}
function postLink(data, postId) {
  const p = postsOf(data)[postId];
  return `<a href="${SNS}/posts/${encodeURIComponent(postId)}" target="veilo">「${esc(postLabel(p) || postId)}」</a>`;
}
// 깔때기 조건 문자열 «텍스트» 에서 단서를 뽑아 어느 글인지 찾는다
function condParts(cond) {
  const quotes = [...cond.matchAll(/«([^»]+)»/g)].map(m => m[1]);
  const tail = cond.match(/→\s*(.+)$/);
  return { quotes, tail: tail ? tail[1] : "" };
}
function findPostByText(data, text) {
  for (const p of data.posts || []) {
    if (mySpans(data, p.post_id).some(s => s.text === text)) return p.post_id;
  }
  return null;
}

// ── 1. 점수가 무슨 뜻인가 ───────────────────────────
function renderScore(data) {
  const rec = data.stage2.output.recommendation;
  const pr = rec.projected;
  const spec = data.specificity.output;
  const target = data.stage2.input && data.stage2.input.risk ? data.stage2.input.risk.target : null;
  const k = spec.k;
  const axes = spec.risk_by_axis || {};
  const bars = Object.entries(axes).filter(([a]) => AXIS[a]).sort((x, y) => y[1] - x[1]).map(([a, v]) => `
    <li><span class="al">${AXIS[a]}</span><span class="ab"><i style="width:${Math.max(2, v)}%"></i></span><span class="av">${Math.round(v)}</span></li>`).join("");
  return `
    <div class="card">
      <div class="row between">
        <h2>${esc(data.nickname || ((data.posts[0] || {}).activity_meta || {}).nickname || data.user_ref)} <small class="muted">@${esc(data.user_ref)}</small></h2>
        <button id="rescanBtn" class="ghost">Veilo 에서 바꾼 뒤 다시 계산</button>
      </div>
      <p class="score"><b>${fmtR(pr.current_risk)}</b><span class="arrow">→</span>
        <b class="down">${fmtR(pr.projected_risk)}</b>
        <span class="unit">추천 조치를 모두 적용했을 때</span></p>
      <p class="hint" style="margin-top:6px">감소 <b>${pr.reduction_pct === null || pr.reduction_pct === undefined ? "—" : fmtR(pr.reduction_pct) + "%"}</b>
        · 지금 나와 같은 조건의 사람 <b>${k === null ? "산출 불가" : "약 " + fmtN(k) + "명"}</b>
        ${target !== null && target !== undefined ? `· 목표 ${fmtR(target)} ${pr.target_met ? "— 추천 조치를 다 하면 닿습니다" : "— 다 해도 못 미칩니다"}` : ""}</p>
      <details class="more">
        <summary>점수는 무슨 뜻인가</summary>
        <p class="explain">
          <b>「나와 같은 조건의 사람이 몇 명 남는가」를 0~100 으로 바꾼 값입니다.</b>
          전 국민이면 0, 한 명으로 좁혀지면 100 에 가깝습니다. 후보가 10 분의 1 로 줄 때마다 점수가 비슷한 폭으로 오릅니다(로그 척도).
          ${target !== null && target !== undefined ? `목표 <b>${fmtR(target)}</b> 아래면 「누구인지 짚기 어려운 수준」으로 봅니다.` : ""}
          「판단 보류」는 오류가 아닙니다 — 단서가 없으면 추측하지 않습니다. 실제 값은 산출하지 않고 «특정 가능한가» 까지만 봅니다.
        </p>
        ${bars ? `<h4>어느 신상이 점수를 올리는가 <small>— 100 = 그 축만으로 거의 특정</small></h4><ul class="axes">${bars}</ul>` : ""}
      </details>
    </div>`;
}

// ── 2. 어떻게 좁혀지나 — 깔때기 ────────────────────
function renderFunnel(data) {
  const steps = (data.specificity.output.steps || []);
  if (steps.length < 2) return "";
  const nation = steps[0].n_after;
  const lis = steps.map((s, i) => {
    const { quotes, tail } = condParts(s.condition);
    const w = Math.max(1.5, 100 * Math.log10(s.n_after + 1) / Math.log10(nation + 1));
    let desc, src = "";
    if (i === 0) { desc = "전 국민"; src = "행정안전부 주민등록 인구"; }
    else {
      desc = `${AXIS[s.axis] || s.axis}${tail ? ` — ${esc(tail)}` : ""}`;
      const where = quotes.map(q => { const pid = findPostByText(data, q); return `「${esc(q)}」${pid ? ` <span class="src">${postLink(data, pid)}</span>` : ""}`; }).join(" · ");
      const how = s.method === "ratio_damped"
        ? `비율 추정 · 신뢰도 ${s.confidence}` : "주민등록 인구통계에서 실제로 센 수";
      src = `${where}${where ? " · " : ""}<span class="muted">${how}</span>`;
    }
    return `<li><div class="fl"><span class="fd">${desc}</span><span class="fs">${src}</span></div>
      <span class="fk">${fmtN(s.n_after)}명</span><i class="fb" style="width:${w}%"></i></li>`;
  }).join("");
  return `
    <details class="card more sec">
      <summary>어떻게 ${fmtN(steps[steps.length - 1].n_after)}명까지 좁혀지나 <small>— 글 속 문장이 하나씩 후보를 거르는 순서</small></summary>
      <p class="hint">각 줄은 그 조건을 더했을 때 남는 사람 수입니다. 이름·전화번호 없이도 문장들이 <b>결합</b>되면 여기까지 좁혀집니다. 조치는 이 중 어느 줄을 끊느냐입니다.</p>
      <ul class="funnel">${lis}</ul>
    </details>`;
}

// ── 3. 조치 — 무엇을 · 어떻게 · 왜 ─────────────────
function renderActions(data) {
  const rec = data.stage2.output.recommendation;
  const posts = postsOf(data);
  const cur = rec.projected.current_risk;
  const k = data.specificity.output.k;
  if (!rec.actions.length) {
    // 목표(기본 40)보다 이미 낮으면 조치가 비는 게 정상이다 — 빈 화면 대신 이유를 보여 준다 (#319 리뷰 1번)
    // 계정·연락처가 남아 있으면 「필요 없음」이라고 하지 않는다 — 위의 「먼저 지울 것」이 남은 조치다 (#326)
    const target = data.stage2.input && data.stage2.input.risk ? data.stage2.input.risk.target : null;
    const strong = strongIdentifiers(data).length;
    let msg;
    if (rec.projected.target_met && target !== null && target !== undefined) {
      msg = strong
        ? `점수 ${fmtR(cur)}는 목표 ${fmtR(target)}보다 낮습니다. 그래도 <b>위의 「먼저 지울 것」은 처리하세요</b> — 점수와 별개로 계정·연락처에 바로 닿습니다.`
        : `지금 점수 ${fmtR(cur)}가 목표 ${fmtR(target)}보다 낮아 <b>추가 조치가 필요하지 않습니다.</b> 더 줄이고 싶으면 아래 「어떤 글부터」를 참고하세요.`;
    } else {
      msg = `추천할 조치가 없습니다.${strong ? " 위의 「먼저 지울 것」은 처리하세요." : ""}`;
    }
    return `<h3>추천 조치</h3><div class="card"><p>${msg}</p></div>`;
  }
  const cards = rec.actions.map(a => {
    const A = ACTION[a.action_type] || { no: "", nm: a.action_type, how: "" };
    const [bl, bc] = BURDEN[a.burden] || [a.burden, ""];
    const after = cur + (a.projected_delta || 0);
    let what = "", why = "";

    if (a.action_type === "unpublish") {
      what = `<ul class="targets">${a.targets.map(t => {
        const c = contribOf(data, t.ref); const kw = kWithout(data, t.ref);
        const clues = spanTexts(data, t.ref, c ? c.clue_ids : mySpans(data, t.ref).map(s => s.span_id));
        return `<li>${postLink(data, t.ref)}
          ${clues.length ? `<div class="clues">읽히는 단서: ${clues.map(x => `<mark>${esc(x)}</mark>`).join(" ")}</div>` : ""}
          <div class="eff">이 글만 내리면 점수 ${fmtR(cur)} → <b>${c ? fmtR(c.risk_without) : "—"}</b>${
            kw === null || k === null ? ""
            : fmtN(kw) === fmtN(k) ? ` · 후보 수는 그대로 — 같은 단서가 다른 글에도 있습니다`   // E 리뷰: 「15,069 → 15,069」 는 헷갈린다
            : ` · 후보 약 ${fmtN(k)}명 → <b>약 ${fmtN(kw)}명</b>`}</div></li>`;
      }).join("")}</ul>`;
      why = `위 단서들이 깔때기의 한 단계씩을 만들고 있습니다. 글을 내리면 그 단계가 사라져 후보가 다시 늘어나고, 그만큼 점수가 내려갑니다. 글은 지워지지 않고 비공개로만 바뀝니다.`;
    } else if (a.action_type === "activity_meta") {
      const tagged = (data.posts || []).filter(p => p.geo_tag);
      what = tagged.length
        ? `<ul class="targets">${tagged.map(p => `<li>${postLink(data, p.post_id)} <span class="geochip">📍 ${esc(p.geo_tag)}</span></li>`).join("")}</ul>`
        : `<p class="muted">위치태그가 붙은 글이 없습니다.</p>`;
      why = `위치태그는 본문이 아니라 글에 붙은 메타 정보라, 본문만 읽는 검사 도구는 보지 못합니다. 하지만 사는 동네를 글마다 반복해 찍어 주는 셈이라 거주지 축을 직접 좁힙니다.${a.projected_delta === 0 ? " 지금은 본문 단서가 같은 동네를 이미 말하고 있어 점수 변화가 0 으로 나옵니다 — 본문을 고친 뒤에는 이 태그가 남은 마지막 단서가 됩니다." : ""}`;
    } else if (a.action_type === "rewrite") {
      const n = a.targets.length;
      what = `<p>글 ${n}편의 명시 표현 — ${a.targets.slice(0, 4).map(t => postLink(data, t.ref)).join(" · ")}${n > 4 ? ` 외 ${n - 4}편` : ""}. <a href="#rewrites">바꿀 후보 보기 ↓</a></p>`;
      why = `숫자 나이·동네 이름 같은 명시 표현만 넓은 말로 바꾸면 그 문장이 거르는 폭이 줄어듭니다. 효과는 단서를 전부 고쳤을 때 기준이고, 「잔존」 표시가 있는 후보는 단서가 약해지지만 남습니다.`;
    } else {
      what = `<p>${a.targets.map(t => esc(`${t.kind}:${t.ref}`)).join(", ")}</p>`;
    }

    return `
    <div class="card act">
      <div class="act-head">
        <span class="nm">${A.no} ${esc(A.nm)}</span>
        <span class="pill b-${bc}">부담 ${esc(bl)}</span>
        <span class="pill sure">${esc(SURE[a.certainty] || a.certainty || "")}</span>
        <span class="delta">점수 ${fmtR(cur)} → <b>${fmtR(after)}</b> <small>(${a.projected_delta > 0 ? "+" : ""}${fmtR(a.projected_delta)})</small></span>
      </div>
      <div class="what">${what}</div>
      <details class="more">
        <summary>어떻게 하고, 왜 내려가나</summary>
        ${a.rationale ? `<p class="rationale">${esc(a.rationale)}</p>` : ""}
        <h4>어떻게</h4><p>${esc(A.how)}</p>
        <h4>왜 점수가 내려가나</h4><p>${why}</p>
      </details>
    </div>`;
  }).join("");
  return `
    <h3>추천 조치 <small>— 부담이 낮은 것부터. 전부 할 필요는 없습니다</small></h3>
    ${cards}
    <p class="note">전부 적용하면 <b>${fmtR(cur)} → ${fmtR(rec.projected.projected_risk)}</b> · 목표 ${rec.projected.target_met ? "달성" : "미달"}.
      예상 점수는 그 조치를 적용한 상태로 다시 센 값이라 단순 합과 다를 수 있습니다. 실행은 Veilo 에서 사용자가 직접 합니다.</p>`;
}

// ── 4. 어떤 글부터 ──────────────────────────────────
function renderOrder(data) {
  const gp = (data.contribution.output.greedy_path || []);
  const kg = (data.k_by_post && data.k_by_post.greedy) || [];
  if (!gp.length) return "";
  const cur = data.contribution.output.baseline_risk;
  const k = data.specificity.output.k;
  let prev = cur;
  const rows = gp.map((g, i) => {
    const kk = kg[i] && kg[i].remove === g.remove ? kg[i].k_after : null;
    const row = `<li>${postLink(data, g.remove)}
      <span class="eff">점수 ${fmtR(prev)} → <b>${fmtR(g.risk_after)}</b>${kk !== null ? ` · 후보 약 ${fmtN(kk)}명` : ""}</span></li>`;
    prev = g.risk_after; return row;
  }).join("");
  return `
    <details class="card more sec">
      <summary>어떤 글부터 내리면 좋을까 <small>— 한 편씩 내릴 때 점수가 가장 빨리 떨어지는 순서</small></summary>
      <p class="hint">위 「① 글 비공개」와 같은 계산입니다. 한 편 내린 뒤 다시 센 값이라, 뒤로 갈수록 한 편당 효과가 작아집니다.${k !== null ? ` 지금 후보 약 ${fmtN(k)}명.` : ""}</p>
      <ol class="order">${rows}</ol>
    </details>`;
}

// ── 5. 표현 바꿔 쓰기 ───────────────────────────────
function renderRewrites(data) {
  const rws = data.stage2.output.rewrites || [];
  if (!rws.length) return "";
  const groups = new Map();
  for (const r of rws) {
    const key = `${r.post_id}|${r.span_id}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  }
  const posts = postsOf(data);
  const cards = [];
  for (const [key, list] of groups) {
    const [postId, spanId] = key.split("|");
    const span = spanOf(data, postId, spanId);
    const post = posts[postId];
    if (!span || !post) continue;
    const text = (channelsOf(post).find(([tid]) => tid === span.text_id) || [null, ""])[1];
    const before = cpSlice(text, Math.max(0, span.start - 25), span.start);
    const after = cpSlice(text, span.end, span.end + 25);
    const options = list.map(r => `
      <div class="rewrite">…${esc(before)}<mark>${esc(r.suggestion)}</mark>${esc(after)}…
        <span class="note">${r.residual_risk === "none" ? "단서가 사라집니다" : "잔존 — 단서가 약해지지만 남습니다"}</span></div>`).join("");
    cards.push(`<div class="card"><p class="rw-head">${postLink(data, postId)} 에서 <del>${esc(span.text)}</del> <span class="muted">(${TYPE_LABEL[span.type] || span.type})</span> 대신</p>${options}
      <p class="go"><a class="btn" href="${SNS}/posts/${encodeURIComponent(postId)}" target="veilo">Veilo 에서 이 글 고치기 →</a></p></div>`);
  }
  if (!cards.length) return "";
  return `<details class="more sec" id="rewrites">
    <summary>표현 바꿔 쓰기 <small>— 「③ 표현만 바꾸기」의 후보 ${cards.length}곳</small></summary>
    <p class="note">확실하지 않으면 후보를 내지 않습니다. 후보가 없는 단서는 아래 「직접 고쳐 볼 표현」을 참고하세요. 안전할수록 원문에서 멀어집니다.</p>${cards.join("")}
  </details>`;
}

// ── 6. 직접 고쳐 볼 표현 — 바꿔 쓰기 후보가 없는 내 단서 (#329) ──
// 직업 · 장소 단서는 규칙으로 안전하게 바꿀 말이 거의 없고, 로컬 모델로 만든 후보는 새 글에서 good 37% 라 넣지 않았다 (exp21 · 10/9).
// 「후보 없음」으로 끝내지 않고 고칠 방향을 보여 준다
const MANUAL_TIP = {
  JOB: "업종 · 가게나 회사 이름, 하는 일의 세부(쓰는 도구 · 업무 이름)는 「일하는 곳」 「일」 정도로 넓혀 보세요.",
  REL_WORK: "회사 근처 장소나 사내 시설 이름은 「회사 근처」처럼 넓혀 보세요.",
  REL_HOME: "집 근처 가게 · 건물 이름은 「동네 가게」 「집 근처」처럼 바꿔 보세요.",
  LOC_FACILITY: "가게 · 공원 · 학교 이름 대신 「근처 공원」 「한 카페」처럼 종류만 남겨 보세요.",
  LOC_ADMIN: "동 · 구 이름은 시나 도 단위로 넓혀 보세요.",
  AGE: "나이는 「30대」처럼 범위로 바꾸거나 빼 보세요.",
  FAM: "몇째인지, 가족의 나이 · 학년 같은 구성은 「가족」 「아이」처럼 넓혀 보세요.",
  COMMUTE: "노선 · 정류장 · 걸리는 시간은 빼거나 「버스로」 정도만 남겨 보세요.",
  INCOME: "금액 · 대출이나 수당 종류는 빼거나 「돈」 「비용」처럼 넓혀 보세요.",
  SEX: "호칭(언니 · 오빠 · 남편 등)은 성별을 짐작하게 하는 단서가 될 수 있습니다. 「가족」 「친구」로 바꿔도 뜻이 통하는지 보세요.",
};

// 표현에서 끝 조사를 떼 같은 말끼리 묶는다 — 「할멈과 · 할멈이 · 할멈은」 → 「할멈」 (#329 리뷰 2번)
const _TAIL_PARTICLES = ["하고는", "에게서", "이랑", "하고", "에서", "에게", "한테", "께서", "까지", "부터", "으로", "이나",
  "은", "는", "이", "가", "을", "를", "과", "와", "에", "께", "랑", "로", "의", "도", "만", "나"];
const _ONE_CHAR_KIN = new Set(["딸", "형", "처", "애", "손"]);  // 한 글자라도 진짜 단서인 가족 호칭
function _core(text) {
  let t = String(text || "").trim().replace(/[\s.,!?…~'"“”‘’()\[\]]+$/u, "");
  for (const p of _TAIL_PARTICLES) {
    if (t.endsWith(p) && (t.length > p.length + 1 || _ONE_CHAR_KIN.has(t.slice(0, -p.length)))) { t = t.slice(0, -p.length); break; }
  }
  return t;
}
// 조각 — 두 글자 미만이거나 어미·조사로 시작하는 말(「으러」 「며」)은 1단의 잘린 조각이라 보여 주지 않는다 (#329 리뷰 1번)
const _FRAGMENT = /^(?:으|러|며|고서|면서|는데|은데|니까|어서|아서|이랑|하고)/u;
function _isFragment(core) {
  return core.length === 0 || (core.length < 2 && !_ONE_CHAR_KIN.has(core)) || _FRAGMENT.test(core);
}

function renderManualTips(data) {
  const withCandidate = new Set((data.stage2.output.rewrites || []).map(r => `${r.post_id}|${r.span_id}`));
  const posts = postsOf(data);
  const byType = new Map();
  const inferred = new Map();  // 추론 단서는 「30대처럼」 같은 고칠 방향이 맞지 않아 개수만 따로 (#329 리뷰 3번)
  for (const [postId, entry] of Object.entries(data.spans || {})) {
    for (const s of (entry.spans || [])) {
      if (s.subject === "other" || withCandidate.has(`${postId}|${s.span_id}`) || !MANUAL_TIP[s.type]) continue;
      const core = _core(s.text);
      if (_isFragment(core)) continue;
      if (s.level === "inferential") { inferred.set(s.type, (inferred.get(s.type) || 0) + 1); continue; }
      if (!byType.has(s.type)) byType.set(s.type, new Map());
      const group = byType.get(s.type);
      if (!group.has(core)) group.set(core, { core, posts: new Set(), first: postId });
      group.get(core).posts.add(postId);
    }
  }
  if (!byType.size && !inferred.size) return "";
  let nItems = 0;
  const cards = [...byType].map(([type, group]) => {
    const list = [...group.values()].sort((a, b) => b.posts.size - a.posts.size);
    nItems += list.length;
    const items = list.slice(0, 6).map(g => {
      const where = g.posts.size > 1 ? `글 ${g.posts.size}편` : postLink(data, g.first);
      return `<li><mark>${esc(g.core)}</mark> — ${where}</li>`;
    }).join("");
    const more = list.length > 6 ? `<p class="note">외 ${list.length - 6}개</p>` : "";
    const inf = inferred.get(type) ? `<p class="note">여러 정황으로 짐작되는 단서 ${inferred.get(type)}개는 진단 화면에서 글과 함께 확인하세요.</p>` : "";
    inferred.delete(type);
    return `<div class="card tip"><b>${esc(TYPE_LABEL[type] || type)}</b><p>${esc(MANUAL_TIP[type])}</p><ul>${items}</ul>${more}${inf}</div>`;
  }).join("");
  const restInf = [...inferred].map(([type, n]) => `${esc(TYPE_LABEL[type] || type)} ${n}개`).join(" · ");
  const rest = restInf ? `<p class="note">여러 정황으로 짐작되는 단서(${restInf})는 진단 화면에서 글과 함께 확인하세요.</p>` : "";
  return `<details class="more sec">
    <summary>직접 고쳐 볼 표현 <small>— 자동 후보가 없는 단서 ${nItems}개 · 유형별 고치는 방향</small></summary>
    <p class="note">자동으로 바꿀 말을 정하기 어려운 단서입니다. 유형별로 고치는 방향을 참고해 직접 다듬어 주세요.</p>${cards}${rest}
  </details>`;
}

async function rescan(user_ref) {
  const b = document.getElementById("rescanBtn");
  if (b) { b.disabled = true; b.textContent = "다시 세는 중…"; }
  const r = await fetch(`../scan/${encodeURIComponent(user_ref)}`, { method: "POST" });
  if (!r.ok) { if (b) { b.disabled = false; b.textContent = "실패 — 다시 시도"; } return; }
  saveScan(await r.json());
  render();
}

function render() {
  const data = loadScan();
  const el = document.getElementById("content");
  if (!data) {
    el.innerHTML = `<p class="error">스캔 결과가 없습니다. <a href="scan.html">스캔 화면</a>에서 먼저 스캔하세요.</p>`;
    return;
  }
  el.innerHTML = renderScore(data)
    + renderDirectIdentifiers(data, "먼저 지울 것 — 계정·연락처로 바로 연결되는 정보")   // #326 · 점수와 별개
    + renderActions(data) + renderFunnel(data) + renderOrder(data) + renderRewrites(data) + renderManualTips(data);
  document.getElementById("rescanBtn").onclick = () => rescan(data.user_ref);
  // ③ 카드의 「후보는 아래에」 링크 → 접힌 섹션을 펼치고 이동
  el.querySelectorAll('a[href="#rewrites"]').forEach(a => a.addEventListener("click", () => { const d = document.getElementById("rewrites"); if (d) d.open = true; }));
}

render();
</script>

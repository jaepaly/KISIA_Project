<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>진단 — 파도풀</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">파도풀 <span class="brand-sub">올리기 전에, 내가 몇 명 중 한 명인지</span></div>
    <div class="engine" id="badge"></div>
  </div>
</header>

<nav class="steps">
  <a href="scan.html"><span class="n">1</span>스캔</a>
  <a href="diagnosis.html" aria-current="step"><span class="n">2</span>진단</a>
  <a href="action.html"><span class="n">3</span>조치</a>
</nav>

<main>
<h1>AI가 추정한 당신</h1>
<p class="lede">모아 둔 글에서 무엇이 읽히는지, 그래서 몇 명 중 한 명까지 좁혀지는지 보여줍니다.</p>
<div id="content">불러오는 중...</div>
</main>

<footer>엔진 판정은 참고용입니다. 최종 판단과 조치는 사용자가 합니다.</footer>

<div class="cta-bar" id="ctaBar" hidden>
  <div class="cta-in">
    <span class="muted">무엇이 읽히는지 봤다면, 이제 되돌릴 방법을</span>
    <a class="btn" href="action.html">조치 화면으로 →</a>
  </div>
</div>

<script src="common.js"></script>
<script>
showEngineBadge("badge");

function renderSpecificity(spec) {
  const o = spec.output;
  if (o.k === null) {
    return `<p><span class="badge unknown">산출 불가</span> 현재 조건으로는 k(추정 후보 수)를 계산할 수 없습니다.</p>`;
  }
  return `<p><span class="badge found">${esc(o.k_level)}</span> 글을 모두 엮으면 추정 후보 <b>${fmtK(o.k)}</b>
    <span class="note">(${esc(o.basis.source)}, ${esc(o.basis.as_of)} 기준)</span></p>`;
}

// 「이 글을 내리면 후보가 몇 명이 되나」 — 엔진이 글별 k 를 줄 때만 (목에는 없다)
function postK(data, postId) {
  const kp = data.k_by_post;
  if (!kp || kp.k === null) return "";
  const row = kp.per_post.find(r => r.post_id === postId);
  if (!row || row.k_without === null || !(row.gain > 1.0001)) return "";
  return `<p class="post-k">이 글을 비공개하면 후보 ${fmtK(kp.k)} → ${fmtK(row.k_without)}</p>`;
}

function renderFindings(findings) {
  return Object.entries(findings).map(([attr, f]) => {
    if (f.verdict === "abstain") {
      return `<div class="card"><b>${esc(ATTR_LABEL[attr] || attr)}</b> — <span class="badge abstain">판단 보류</span> <span class="muted">(근거 부족 · 신뢰도 ${esc(f.confidence)})</span></div>`;
    }
    return `<div class="card"><b>${esc(ATTR_LABEL[attr] || attr)}</b> — <span class="badge found">${esc(VERDICT_LABEL[f.verdict] || f.verdict)}</span>
      ${f.granularity ? `<span class="muted">${esc(GRAIN_LABEL[f.granularity] || f.granularity)} 수준</span>` : ""} <span class="muted">· 신뢰도 ${esc(f.confidence)}</span></div>`;
  }).join("");
}

// 스팬 위치는 채널(text_id) 기준이다 — 제목·캡션 스팬을 본문 위치에 칠하지 않는다
function highlight(text, spans) {
  let out = "";
  let last = 0;
  const sorted = [...spans].sort((a, b) => a.start - b.start);
  for (const s of sorted) {
    if (s.start < last) continue;  // 겹치는 스팬은 앞의 것만
    out += esc(cpSlice(text, last, s.start));
    const other = s.subject === "other";
    const tip = `${TYPE_LABEL[s.type] || s.type} · ${s.level}${other ? " · 다른 사람 정보 — 내 후보 수 계산에는 안 들어감" : ""}`;
    out += `<span class="${other ? "span-other" : "span-hit"}" data-type="${esc(s.type)}" title="${esc(tip)}">${esc(cpSlice(text, s.start, s.end))}</span>`;
    last = s.end;
  }
  return out + esc(cpSlice(text, last));
}

// 글은 접힌 카드로 — 제목 한 줄 + 단서 개수. 누르면 펼쳐진다 (글이 수십 편이라 다 펼치면 스크롤이 길다)
function renderPosts(data) {
  if (!data.posts.length) {
    return `<div class="card"><p class="empty">탐지된 글이 없습니다 — 위험도 계산 대상 0편</p></div>`;
  }
  return data.posts.map(p => {
    const spans = (data.spans[p.post_id] || { spans: [] }).spans;
    const mine = spans.filter(s => s.subject !== "other").length;
    const others = spans.length - mine;
    const body = channelsOf(p).map(([tid, text]) => {
      const label = tid === "title" ? "제목" : tid === "body" ? "" : "사진 설명";
      return `<p class="post-body">${label ? `<span class="channel">${label}</span>` : ""}${highlight(text, spans.filter(s => s.text_id === tid))}</p>`;
    }).join("");
    const otherNote = others ? `<p class="note">초록 표시 ${others}개는 다른 사람(가족·지인)의 정보로 읽혀 내 후보 수 계산에서 뺐습니다. 그 사람에게는 노출될 수 있는 정보입니다.</p>` : "";
    const types = [...new Set(spans.filter(s => s.subject !== "other").map(s => TYPE_LABEL[s.type] || s.type))];
    const count = mine
      ? `<span class="badge found">단서 ${mine}</span>`
      : (others ? `<span class="badge">남의 정보 ${others}</span>` : `<span class="badge abstain">단서 없음</span>`);
    return `<div class="card post${spans.length ? "" : " quiet"}" data-post>
      <button type="button" class="post-head" aria-expanded="false">
        <span class="post-title">${esc(postLabel(p) || p.post_id)}</span>
        <span class="post-types">${types.map(esc).join(" · ")}</span>
        ${count}
        <span class="chev" aria-hidden="true">⌄</span>
      </button>
      <div class="post-detail" hidden>${body}${otherNote}${postK(data, p.post_id)}</div>
    </div>`;
  }).join("");
}

function wirePosts() {
  document.querySelectorAll("[data-post] .post-head").forEach(h => {
    h.addEventListener("click", () => {
      const open = h.getAttribute("aria-expanded") === "true";
      h.setAttribute("aria-expanded", String(!open));
      h.nextElementSibling.hidden = open;
    });
  });
  const all = document.getElementById("toggleAll");
  if (!all) return;
  all.addEventListener("click", () => {
    const heads = [...document.querySelectorAll("[data-post] .post-head")];
    const expand = heads.some(h => h.getAttribute("aria-expanded") !== "true");
    heads.forEach(h => { h.setAttribute("aria-expanded", String(expand)); h.nextElementSibling.hidden = !expand; });
    all.textContent = expand ? "모두 접기" : "모두 펼치기";
  });
}

const data = loadScan();
const el = document.getElementById("content");
if (!data) {
  el.innerHTML = `<p class="error">스캔 결과가 없습니다. <a href="scan.html">스캔 화면</a>에서 먼저 스캔하세요.</p>`;
} else {
  const nPosts = data.posts.length;
  const nHit = data.posts.filter(p => ((data.spans[p.post_id] || { spans: [] }).spans).some(s => s.subject !== "other")).length;
  el.innerHTML = `
    <div class="card">
      <div class="row between">
        <h2>${esc(data.user_ref)}</h2>
        <a class="btn" href="action.html">조치 화면으로 →</a>
      </div>
      <p class="score"><b>${esc(data.contribution.output.baseline_risk)}</b><span class="unit">/ 100 · 기준 위험도</span></p>
      ${renderSpecificity(data.specificity)}
    </div>
    <h3>7속성 판정</h3>
    ${renderFindings(data.stage2.output.findings)}
    <div class="row between sec">
      <h3>글에서 읽힌 단서 <small>— 글 ${nPosts}편 중 ${nHit}편에서 읽힘 · 제목을 누르면 펼쳐집니다</small></h3>
      <button type="button" id="toggleAll" class="ghost">모두 펼치기</button>
    </div>
    <p class="legend">
      <span style="background:#F9E0B8">거주지</span><span style="background:#CFE6F7">나이</span>
      <span style="background:#F3D9E6">성별</span><span style="background:#D6ECD9">직업</span>
      <span style="background:#E5D9F2">가족</span><span style="background:#E1EEEC">통근</span>
      <span style="background:#FDE8C9">소득</span>
      <span class="span-other">다른 사람 정보</span>
    </p>
    ${renderPosts(data)}
  `;
  wirePosts();
  document.getElementById("ctaBar").hidden = false;
}
</script>
</body>
</html>

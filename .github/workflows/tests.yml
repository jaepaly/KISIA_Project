name: tests

# =============================================================
#  PR 마다 단위 테스트를 돌린다 — 지금까지는 커밋 형식(commit-lint)만 자동이었다.
#
#  무거운 것(torch · transformers · GPU)이 필요 없는 테스트만 모았다.
#  c1 모델 추론·학습(exp06)과 2단 Qwen 실행은 체크포인트가 저장소에 없어 여기서 돌 수 없다.
#
#  같은 이름의 test_*.py 가 여러 폴더에 있어 --import-mode=importlib 로 모은다.
#  로컬에서 똑같이:
#    PYTHONPATH=src python -m pytest -q --import-mode=importlib <아래 경로들>
# =============================================================

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 (가벼운 것만)
        run: python -m pip install --disable-pip-version-check pytest jsonschema numpy scipy "Flask>=3.0"

      - name: 단위 테스트
        env:
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
        # 필수 경로는 없으면 실패한다 — 폴더 이름이 바뀌거나 지워졌는데 검사 범위만 줄어든 채 통과하는 걸 막는다 (#305 리뷰).
        # 실험 폴더는 브랜치에 따라 없을 수 있어 선택 — 있으면 돌린다.
        run: |
          required="src/kopl/c1_span/test_span.py src/kopl/c1_span/test_attributes.py src/kopl/c2_specificity src/kopl/c4_stage2 src/kopl/c5_corpus tests apps/sns/test_export.py"
          optional="experiments/exp09-external-agreement experiments/exp11-risk-correlation experiments/exp17-planted-eval/test_score.py"
          missing=""
          for p in $required; do [ -e "$p" ] || missing="$missing $p"; done
          if [ -n "$missing" ]; then
            echo "::error::필수 테스트 경로가 없다:$missing — 옮겼다면 이 워크플로의 required 도 같이 고친다"
            exit 1
          fi
          existing=""
          for p in $optional; do
            if [ -e "$p" ]; then existing="$existing $p"; else echo "::notice::선택 경로 없음(건너뜀): $p"; fi
          done
          python -m pytest -q --import-mode=importlib $required $existing

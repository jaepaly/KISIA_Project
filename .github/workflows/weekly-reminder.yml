name: weekly-reminder

# =============================================================
#  주간 마감 리마인더 → Discord #공지
#
#  매주 반복되는 일정 넷을 알린다. PM 이 매주 카톡으로 챙기던 것이다.
#
#    월 14:00  주간 보고회    → 13:00 알림
#    화 20:00  팀 회의        → 19:00 알림
#    수 23:59  개별 보고 마감  → 18:00 알림
#                                 (승인 대기 PR 을 «사람별로» + PR·이슈 목록)
#    목 20:00  정기 멘토링    → 19:00 알림
#
#  모임 알림은 «누가·언제» 만 남긴다. 안건을 넣으면 길어지고,
#  길면 안 읽는다. 안건은 docs/mentoring/ 에 있다.
#  제출 마감(금)은 PM 단독 작업이라 알림을 두지 않는다.
#
#  ⚠️ #github 채널과 웹훅을 나눈 이유 — 성격이 다르다.
#     #github  개인 멘션. 처리하면 끝. 흘러가도 된다
#     #공지    공지. 남아 있어야 한다. 주 3회뿐이라 안 밀린다
#     섞으면 알림 설정(@멘션만 / 모든 메시지)을 나눌 수 없다.
#
#  ⚠️ 전송은 curl 로 한다. Python urllib 는 Cloudflare 가 UA 를 보고
#     막는다 (HTTP 403 / error 1010). 실측 2026-08-25.
#
#  cron 은 UTC 다. KST = UTC+9.
# =============================================================

on:
  schedule:
    - cron: "0 4 * * 1"    # 월 13:00 KST — 주간 보고회(14:00) 1시간 전
    - cron: "0 10 * * 2"   # 화 19:00 KST — 팀 회의(20:00) 1시간 전
    - cron: "0 9 * * 3"    # 수 18:00 KST — 개별 보고 마감(23:59) 6시간 전
    - cron: "0 10 * * 4"   # 목 19:00 KST — 정기 멘토링(20:00) 1시간 전
  workflow_dispatch:
    inputs:
      kind:
        description: "어느 리마인더인가 (mon / tue / wed / thu)"
        required: true
        default: "wed"

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 리마인더 조립·전송
        env:
          WEBHOOK: ${{ secrets.DISCORD_ANNOUNCE_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          CRON: ${{ github.event.schedule }}
          KIND_IN: ${{ inputs.kind }}
        run: |
          set -uo pipefail
          [ -n "${WEBHOOK:-}" ] || { echo "DISCORD_ANNOUNCE_WEBHOOK_URL 미설정 — 건너뛴다"; exit 0; }

          MAP=.github/discord-map.json

          # 어느 리마인더인가
          case "${CRON:-}" in
            "0 4 * * 1")  KIND=mon ;;
            "0 10 * * 2") KIND=tue ;;
            "0 9 * * 3")  KIND=wed ;;
            "0 10 * * 4") KIND=thu ;;
            *)            KIND="${KIND_IN:-wed}" ;;
          esac
          echo "kind=$KIND"

          # ── 멘션 만들기. ID 미등록자는 이름만 ─────────────────
          mention() {
            out=""
            for u in "$@"; do
              id=$(jq -r --arg k "$u" '.[$k] // ""' "$MAP")
              if [ -n "$id" ]; then out="$out <@$id>"; else out="$out @$u"; fi
            done
            printf '%s' "$(echo "$out" | sed 's/^ //')"
          }
          TEAM=$(mention nuewsun philotti jhyun114 zihhhhh)
          ALL=$(mention nuewsun philotti jhyun114 zihhhhh jaepaly)

          # ── 지금 열린 PR 을 실시간으로 긁는다 ──────────────────
          prs=$(gh pr list --state open --limit 20 \
                  --json number,title,author,reviewRequests \
                  --jq '.[] | "· #\(.number) \(.title[:38]) — \(.author.login)\(if (.reviewRequests|length)>0 then " (리뷰 대기: " + ([.reviewRequests[].login]|join(", ")) + ")" else "" end)"' \
                2>/dev/null || echo "")
          [ -n "$prs" ] || prs="· 없음"

          issues=$(gh issue list --state open --limit 10 \
                     --json number,title,assignees \
                     --jq '.[] | "· #\(.number) \(.title[:38])\(if (.assignees|length)>0 then " — " + ([.assignees[].login]|join(", ")) else "" end)"' \
                   2>/dev/null || echo "")
          [ -n "$issues" ] || issues="· 없음"

          # ── 승인 0건인 PR 을 «사람별로» 묶는다 ─────────────────
          #    위 PR 목록은 평평해서 급한 게 안 보인다. 「PR 6개」보다
          #    「당신이 4건 밀려 있다」가 사람을 움직인다.
          #
          #    승인 판정은 latestReviews 로 한다. reviewDecision 은
          #    필수 승인 수가 0이면 null 로 와서 못 쓴다 (실측).
          #
          #    ⚠️ --state open 을 절대 빼지 마라. GitHub 은 머지·닫힌 PR 에도
          #    reviewRequests 를 그대로 남긴다 (실측 2026-08-26: #2·#42·#47 이
          #    머지된 뒤에도 요청이 남아 있었다). 빼면 이미 끝난 PR 이 전부
          #    「당신 승인 대기」로 다시 뜬다.
          waiting=$(gh pr list --state open --limit 30 \
                      --json number,reviewRequests,latestReviews \
                      --jq '[ .[]
                              | select((.latestReviews // [] | map(select(.state=="APPROVED")) | length) == 0)
                              | . as $p | .reviewRequests[] | {login:.login, num:$p.number} ]
                            | group_by(.login)
                            | map({login:.[0].login, prs:(map(.num)|sort|reverse)})
                            | sort_by(-(.prs|length)) | .[]
                            | "\(.login)\t\(.prs|map("#\(.)")|join(" "))"' \
                    2>/dev/null || echo "")

          review_block=""
          if [ -n "$waiting" ]; then
            lines=""
            while IFS=$'\t' read -r who list; do
              [ -n "$who" ] || continue
              lines="$lines$(mention "$who") · $list"$'\n'
            done <<< "$waiting"
            lines=${lines%$'\n'}

            # 제일 오래 묵은 것 하나만 시간과 함께 — 전부 적으면 안 읽는다
            oldest=$(gh pr list --state open --limit 30 \
                       --json number,createdAt,reviewRequests,latestReviews \
                       --jq '[ .[]
                               | select((.latestReviews // [] | map(select(.state=="APPROVED")) | length) == 0)
                               | select((.reviewRequests|length) > 0) ]
                             | sort_by(.createdAt) | .[0] | "#\(.number) \(.createdAt)"' \
                     2>/dev/null || echo "")
            age=""
            if [ -n "$oldest" ] && [ "$oldest" != "null" ]; then
              onum=${oldest%% *}; oiso=${oldest##* }
              h=$(( ( $(date -u +%s) - $(date -u -d "$oiso" +%s) ) / 3600 ))
              age=$(printf '\n가장 오래 기다린 건 **%s — %d시간**입니다.' "$onum" "$h")
            fi

            # 멘션은 코드블록 밖에 둔다. 안에 넣으면 <@id> 가 글자로 나온다
            # ⚠️ 시각을 반드시 넣는다. 이 메시지는 #공지 에 남는데, 나중에 읽는
            #    사람에게는 실시간 목록처럼 보인다. 실제로 발송 뒤에 머지된 PR 이
            #    「내 승인 대기」로 계속 보인다는 제보가 있었다 (2026-08-26).
            now=$(date -u -d '+9 hours' '+%m-%d %H:%M')   # KST = UTC+9. TZ 데이터베이스에 의존하지 않는다
            review_block=$(printf '\n🔍 **승인 기다리는 PR** — %s 기준 · 아래는 전부 **승인 0건**입니다\n\n%s%s\n\n> 이 목록은 발송 시점의 스냅샷입니다. 지금 상태는 PR 목록에서 확인해주세요.\n' \
                           "$now" "$lines" "$age")
          fi

          # ── 본문 ──────────────────────────────────────────────
          case "$KIND" in
            mon)
              body=$(printf '%s\n\n🗓️ **주간 보고회 — 오늘 14:00**' "$ALL")
              ;;
            tue)
              body=$(printf '%s\n\n🗓️ **팀 회의 — 오늘 20:00**' "$ALL")
              ;;
            wed)
              body=$(printf '%s\n\n📋 **개별 보고 5줄 — 오늘 23:59 마감**\n\nCONTRIBUTING 의 5줄 형식 그대로 보내주세요.\n**4번 「증빙 링크」에 커밋·PR 링크**를 꼭 넣어주세요 — 그게 있어야 주간보고에 그대로 옮깁니다.\n%s\n**지금 열린 PR**\n```\n%s\n```\n**열린 이슈**\n```\n%s\n```' \
                     "$TEAM" "$review_block" "$prs" "$issues")
              ;;
            thu)
              body=$(printf '%s\n\n🎓 **정기 멘토링 — 오늘 20:00**' "$ALL")
              ;;
          esac

          payload=$(jq -nc --arg c "$body" '{content:$c, allowed_mentions:{parse:["users"]}}')
          code=$(curl -sS -o /tmp/r -w '%{http_code}' -H 'Content-Type: application/json' \
                   -X POST -d "$payload" "$WEBHOOK")
          if [ "$code" -ge 300 ]; then echo "전송 실패 HTTP $code"; cat /tmp/r; exit 1; fi
          echo "전송 완료 — $KIND"

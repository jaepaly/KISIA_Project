name: weekly-reminder

# =============================================================
#  리마인더 — 수동 실행 전용 (현황판)
#
#  ⚠️ 고정 일정 알림(월·화·수·목)은 여기 없다.
#     PC 작업 스케줄러로 옮겼다 — GitHub 의 schedule 이 실행을
#     통째로 유실했기 때문이다. 실측:
#
#       08-27(목)  10.1시간 지연 도착 → 행사 후라 자동 생략
#       08-31(월)  유실 — 실행 기록 0건
#       09-02(수)  유실 — 실행 기록 0건
#       같은 저장소 dashboard: 하루 12회 예정 → 5~6회만 도착
#
#     GitHub 공식 문서가 schedule 을 best-effort 로 명시한다.
#     고정 문구는 저장소 상태가 필요 없으므로 여기 둘 이유가 없었다.
#
#       ~/.claude/scheduled-tasks/kisia-meeting-reminder/
#         send.py      본문·발송 (표준 라이브러리만 쓴다)
#         run.cmd      작업 스케줄러가 부르는 배치
#         webhook.txt  웹훅 URL (자격증명 — 저장소에 넣지 않는다)
#
#       schtasks /query /tn "KISIA-Reminder-*"
#
#  여기 남은 것은 «저장소를 봐야 하는» 것뿐이다.
#
#    status   PM 이 아무 때나 쏘는 현황판. 「지금 무엇이 누구 손에
#             있는가」만 적는다. 마감·독촉 문구를 넣지 않는다 —
#             사실만 있어야 읽고 판단한다.
#             gh workflow run weekly-reminder.yml -f kind=status
#
#  mon/tue/wed/thu 도 수동으로는 여전히 쏠 수 있다. PC 가 꺼져 있어
#  놓친 날의 예비 수단이다.
#
#  ⚠️ #github 채널과 웹훅을 나눈 이유 — 성격이 다르다.
#     #github  개인 멘션. 처리하면 끝. 흘러가도 된다
#     #공지    공지. 남아 있어야 한다
#     섞으면 알림 설정(@멘션만 / 모든 메시지)을 나눌 수 없다.
#
#  ⚠️ 전송은 curl 로 한다. Python urllib 는 Cloudflare 가 UA 를 보고
#     막는다 (HTTP 403 / error 1010). 실측 2026-08-25.
# =============================================================

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "어느 리마인더인가 (mon / tue / wed / thu / status)"
        required: true
        default: "wed"

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 리마인더 조립·전송
        env:
          WEBHOOK: ${{ secrets.DISCORD_ANNOUNCE_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          KIND_IN: ${{ inputs.kind }}
        run: |
          set -uo pipefail
          [ -n "${WEBHOOK:-}" ] || { echo "DISCORD_ANNOUNCE_WEBHOOK_URL 미설정 — 건너뛴다"; exit 0; }

          MAP=.github/discord-map.json

          # 어느 리마인더인가
          KIND="${KIND_IN:-status}"
          echo "kind=$KIND"

          # 지연 감지·중복 방지는 schedule 트리거 전용이었다. 수동 실행만
          # 남았으므로 뺐다 — 사람이 지금 쏘는 것이라 「늦게 도착」이 없다.
          WHEN="오늘"; LATE=""

          # ── 멘션 만들기. ID 미등록자는 이름만 ─────────────────
          mention() {
            out=""
            for u in "$@"; do
              id=$(jq -r --arg k "$u" '.[$k] // ""' "$MAP")
              if [ -n "$id" ]; then out="$out <@$id>"; else out="$out @$u"; fi
            done
            printf '%s' "$(echo "$out" | sed 's/^ //')"
          }
          TEAM=$(mention nuewsun philotti jhyun114 zihhhhh)
          ALL=$(mention nuewsun philotti jhyun114 zihhhhh jaepaly)

          # ── 지금 열린 PR 을 실시간으로 긁는다 ──────────────────
          prs=$(gh pr list --state open --limit 20 \
                  --json number,title,author,reviewRequests \
                  --jq '.[] | "· #\(.number) \(.title[:38]) — \(.author.login)\(if (.reviewRequests|length)>0 then " (리뷰 대기: " + ([.reviewRequests[].login]|join(", ")) + ")" else "" end)"' \
                2>/dev/null || echo "")
          [ -n "$prs" ] || prs="· 없음"

          issues=$(gh issue list --state open --limit 10 \
                     --json number,title,assignees \
                     --jq '.[] | "· #\(.number) \(.title[:38])\(if (.assignees|length)>0 then " — " + ([.assignees[].login]|join(", ")) else "" end)"' \
                   2>/dev/null || echo "")
          [ -n "$issues" ] || issues="· 없음"

          # ── 승인 0건인 PR 을 «사람별로» 묶는다 ─────────────────
          #    위 PR 목록은 평평해서 급한 게 안 보인다. 「PR 6개」보다
          #    「당신이 4건 밀려 있다」가 사람을 움직인다.
          #
          #    승인 판정은 latestReviews 로 한다. reviewDecision 은
          #    필수 승인 수가 0이면 null 로 와서 못 쓴다 (실측).
          #
          #    ⚠️ --state open 을 절대 빼지 마라. GitHub 은 머지·닫힌 PR 에도
          #    reviewRequests 를 그대로 남긴다 (실측 2026-08-26: #2·#42·#47 이
          #    머지된 뒤에도 요청이 남아 있었다). 빼면 이미 끝난 PR 이 전부
          #    「당신 승인 대기」로 다시 뜬다.
          waiting=$(gh pr list --state open --limit 30 \
                      --json number,reviewRequests,latestReviews \
                      --jq '[ .[]
                              | select((.latestReviews // [] | map(select(.state=="APPROVED")) | length) == 0)
                              | . as $p | .reviewRequests[] | {login:.login, num:$p.number} ]
                            | group_by(.login)
                            | map({login:.[0].login, prs:(map(.num)|sort|reverse)})
                            | sort_by(-(.prs|length)) | .[]
                            | "\(.login)\t\(.prs|map("#\(.)")|join(" "))"' \
                    2>/dev/null || echo "")

          review_block=""
          if [ -n "$waiting" ]; then
            lines=""
            while IFS=$'\t' read -r who list; do
              [ -n "$who" ] || continue
              lines="$lines$(mention "$who") · $list"$'\n'
            done <<< "$waiting"
            lines=${lines%$'\n'}

            # 제일 오래 묵은 것 하나만 시간과 함께 — 전부 적으면 안 읽는다
            oldest=$(gh pr list --state open --limit 30 \
                       --json number,createdAt,reviewRequests,latestReviews \
                       --jq '[ .[]
                               | select((.latestReviews // [] | map(select(.state=="APPROVED")) | length) == 0)
                               | select((.reviewRequests|length) > 0) ]
                             | sort_by(.createdAt) | .[0] | "#\(.number) \(.createdAt)"' \
                     2>/dev/null || echo "")
            age=""
            if [ -n "$oldest" ] && [ "$oldest" != "null" ]; then
              onum=${oldest%% *}; oiso=${oldest##* }
              h=$(( ( $(date -u +%s) - $(date -u -d "$oiso" +%s) ) / 3600 ))
              age=$(printf '\n가장 오래 기다린 건 **%s — %d시간**입니다.' "$onum" "$h")
            fi

            # 멘션은 코드블록 밖에 둔다. 안에 넣으면 <@id> 가 글자로 나온다
            # ⚠️ 시각을 반드시 넣는다. 이 메시지는 #공지 에 남는데, 나중에 읽는
            #    사람에게는 실시간 목록처럼 보인다. 실제로 발송 뒤에 머지된 PR 이
            #    「내 승인 대기」로 계속 보인다는 제보가 있었다 (2026-08-26).
            now=$(date -u -d '+9 hours' '+%m-%d %H:%M')   # KST = UTC+9. TZ 데이터베이스에 의존하지 않는다
            review_block=$(printf '\n🔍 **승인 기다리는 PR** — %s 기준 · 아래는 전부 **승인 0건**입니다\n\n%s%s\n\n> 이 목록은 발송 시점의 스냅샷입니다. 지금 상태는 PR 목록에서 확인해주세요.\n' \
                           "$now" "$lines" "$age")
          fi

          # ── 본문 ──────────────────────────────────────────────
          case "$KIND" in
            mon)
              body=$(printf '%s\n\n🗓️ **주간 보고회 — 오늘 14:00**' "$ALL")
              ;;
            tue)
              body=$(printf '%s\n\n🗓️ **팀 회의 — 오늘 20:00**' "$ALL")
              ;;
            wed)
              body=$(printf '%s\n\n📋 **개별 보고 5줄 — 오늘 23:59 마감**\n\nCONTRIBUTING 의 5줄 형식 그대로 보내주세요.\n**4번 「증빙 링크」에 커밋·PR 링크**를 꼭 넣어주세요 — 그게 있어야 주간보고에 그대로 옮깁니다.\n%s\n**지금 열린 PR**\n```\n%s\n```\n**열린 이슈**\n```\n%s\n```' \
                     "$TEAM" "$review_block" "$prs" "$issues")
              ;;
            thu)
              body=$(printf '%s\n\n🎓 **정기 멘토링 — 오늘 20:00**' "$ALL")
              ;;
            status)
              # PM 이 아무 때나 쏘는 현황판. 일정 알림이 아니라 «지금 무엇이
              # 누구 손에 있는가» 만 적는다. 마감·독촉 문구를 넣지 않는다 —
              # 사실만 있어야 읽고 판단한다.
              #
              # 승인 대기 / 작성자 차례를 reviewRequests 로 가른다.
              # GitHub 이 CODEOWNERS 를 보고 자동으로 요청을 걸어주므로,
              # 요청이 남아 있으면 «남이 승인할 차례», 비었으면 «작성자가
              # 리뷰에 답할 차례» 다. 사람이 분류하지 않아도 맞는다.
              contracts=$(git ls-tree -l HEAD docs/contracts/ \
                            | awk '{printf "%9s  %s\n", $4, $5}' \
                            | sed 's|docs/contracts/||')

              need_review=$(gh pr list --state open --limit 30 \
                              --json number,title,author,reviewRequests \
                              --jq '.[] | select((.reviewRequests|length) > 0)
                                    | "\(.number)\t\(.title)\t\(.author.login)\t\([.reviewRequests[].login]|join(" "))"' \
                            2>/dev/null || echo "")

              need_author=$(gh pr list --state open --limit 30 \
                              --json number,title,author,reviewRequests \
                              --jq '.[] | select((.reviewRequests|length) == 0)
                                    | "\(.number)\t\(.title)\t\(.author.login)"' \
                            2>/dev/null || echo "")

              blk_r=""
              while IFS=$'\t' read -r num title who reqs; do
                [ -n "$num" ] || continue
                blk_r="$blk_r**#$num** $title"$'\n'"작성 $(mention "$who") · 승인 가능 $(mention $reqs)"$'\n\n'
              done <<< "$need_review"

              blk_a=""
              while IFS=$'\t' read -r num title who; do
                [ -n "$num" ] || continue
                blk_a="$blk_a**#$num** $title — $(mention "$who")"$'\n'
              done <<< "$need_author"

              [ -n "$blk_r" ] && blk_r=$(printf '\n**승인 대기**\n\n%s' "${blk_r%$'\n\n'}")
              [ -n "$blk_a" ] && blk_a=$(printf '\n**작성자 차례** — 리뷰 코멘트가 달려 있습니다\n\n%s' "${blk_a%$'\n'}")

              now=$(date -u -d '+9 hours' '+%m-%d %H:%M')
              body=$(printf '📌 **현황 — %s 기준**\n\n**docs/contracts/**\n```\n%s\n```\n%s\n%s\n\n리뷰 내용은 각 PR 코멘트에 있습니다.' \
                     "$now" "$contracts" "$blk_r" "$blk_a")
              ;;
          esac

          # 지연이면 「오늘」이 거짓말이 된다. 예정일로 바꾸고 경고를 앞에 붙인다.
          # status(수동 현황판)는 SDOW 가 비어 LATE 도 비므로 그대로 나간다.
          # $(...) 는 꼬리 개행을 잘라낸다. 빈 줄은 여기서 넣는다.
          if [ -n "$LATE" ]; then body="$LATE"$'\n\n'"${body//오늘/$WHEN}"; fi

          payload=$(jq -nc --arg c "$body" '{content:$c, allowed_mentions:{parse:["users"]}}')
          code=$(curl -sS -o /tmp/r -w '%{http_code}' -H 'Content-Type: application/json' \
                   -X POST -d "$payload" "$WEBHOOK")
          if [ "$code" -ge 300 ]; then echo "전송 실패 HTTP $code"; cat /tmp/r; exit 1; fi
          echo "전송 완료 — $KIND"

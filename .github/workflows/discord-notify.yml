name: discord-notify

# =============================================================
#  GitHub → Discord 개인 알림
#
#  왜 만들었나 — CODEOWNERS 가 리뷰를 자동 요청해도 본인이 그걸
#  보지 못하면 게이트가 대기열이 된다. 실제로 PR #5 가 리뷰를
#  이틀 기다렸고, 목요일 계약 머지가 거기 걸려 있었다.
#
#  GitHub 공식 Discord 웹훅은 채널에 카드만 띄운다. 누가 누구인지
#  모르니 개인 멘션을 못 한다. 그래서 매핑을 두고 직접 보낸다.
#
#  매핑   .github/discord-map.json   (Discord 사용자 ID. 공개돼도 무해)
#
#  ⚠️ 전송은 curl 로 한다. Python urllib 로 보내면 Cloudflare 가
#     UA 를 보고 막는다 (HTTP 403, error code 1010). 실측 2026-08-25.
#     «파이썬으로 바꾸면 깔끔하겠다» 는 생각이 들면 이 줄을 볼 것.
#  URL    시크릿 DISCORD_WEBHOOK_URL (자격증명. 저장소는 public 이다)
# =============================================================

on:
  pull_request:
    types: [review_requested]
  pull_request_review:
    types: [submitted]
  issues:
    types: [assigned]
  issue_comment:
    types: [created]
  # 배선 확인용. 실제 이벤트를 기다리지 않고 한 번 쏴본다.
  workflow_dispatch:
    inputs:
      to:
        description: "멘션할 GitHub 로그인 (discord-map.json 의 키). 비우면 멘션 없이 전송"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.event.sender.type != 'Bot'
    steps:
      - uses: actions/checkout@v4

      - name: 알림 조립·전송
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT: ${{ github.event_name }}
          PAYLOAD: ${{ toJSON(github.event) }}
          ACTOR: ${{ github.actor }}
          DISPATCH_TO: ${{ inputs.to }}
        run: |
          set -uo pipefail
          [ -n "${WEBHOOK:-}" ] || { echo "DISCORD_WEBHOOK_URL 미설정 — 건너뛴다"; exit 0; }

          MAP=.github/discord-map.json
          jq -e . "$MAP" >/dev/null || { echo "매핑 파일이 깨졌다"; exit 1; }

          # ── 이벤트별로 «누구에게 / 무엇을» 을 뽑는다 ──────────────
          targets=""; kind=""; title=""; url=""; num=""
          case "$EVENT" in
            workflow_dispatch)
              targets="${DISPATCH_TO:-}"
              kind="배선 확인"
              title="discord-notify 워크플로가 정상 동작합니다"
              url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              num="test"
              ;;
            pull_request)
              targets=$(jq -r '.requested_reviewer.login // empty' <<<"$PAYLOAD")
              kind="리뷰 요청"
              title=$(jq -r '.pull_request.title' <<<"$PAYLOAD")
              url=$(jq -r '.pull_request.html_url' <<<"$PAYLOAD")
              num=$(jq -r '.pull_request.number' <<<"$PAYLOAD")
              ;;
            pull_request_review)
              targets=$(jq -r '.pull_request.user.login' <<<"$PAYLOAD")
              state=$(jq -r '.review.state' <<<"$PAYLOAD")
              case "$state" in
                approved)          kind="리뷰 승인" ;;
                changes_requested) kind="변경 요청" ;;
                *)                 kind="리뷰 도착" ;;
              esac
              title=$(jq -r '.pull_request.title' <<<"$PAYLOAD")
              url=$(jq -r '.review.html_url' <<<"$PAYLOAD")
              num=$(jq -r '.pull_request.number' <<<"$PAYLOAD")
              ;;
            issues)
              targets=$(jq -r '.assignee.login // empty' <<<"$PAYLOAD")
              kind="이슈 배정"
              title=$(jq -r '.issue.title' <<<"$PAYLOAD")
              url=$(jq -r '.issue.html_url' <<<"$PAYLOAD")
              num=$(jq -r '.issue.number' <<<"$PAYLOAD")
              ;;
            issue_comment)
              # 본문에서 @아이디를 뽑아 매핑에 있는 사람만 남긴다
              body=$(jq -r '.comment.body' <<<"$PAYLOAD")
              known=$(jq -r 'keys[] | select(startswith("_") | not)' "$MAP")
              for u in $known; do
                grep -qi -- "@$u" <<<"$body" && targets="$targets $u"
              done
              kind="멘션"
              title=$(jq -r '.issue.title' <<<"$PAYLOAD")
              url=$(jq -r '.comment.html_url' <<<"$PAYLOAD")
              num=$(jq -r '.issue.number' <<<"$PAYLOAD")
              ;;
          esac

          # 수동 실행(배선 확인)은 대상이 없어도 채널에 쏜다
          if [ -z "$(tr -d '[:space:]' <<<"${targets:-}")" ] && [ "$EVENT" != "workflow_dispatch" ]; then
            echo "대상 없음 — 건너뛴다"; exit 0
          fi

          # ── 멘션 문자열 만들기. 자기 행동은 자기에게 안 보낸다 ────
          mentions=""; names=""
          for t in $targets; do
            if [ "$t" = "$ACTOR" ] && [ "$EVENT" != "workflow_dispatch" ]; then
              echo "  자기 행동 — $t 건너뜀"; continue
            fi
            id=$(jq -r --arg k "$t" '.[$k] // ""' "$MAP")
            if [ -n "$id" ]; then
              mentions="$mentions <@$id>"
            else
              names="$names @$t"     # ID 미등록 — 이름만
            fi
          done
          who=$(tr -s ' ' <<<"${mentions}${names}" | sed 's/^ //;s/ $//')
          if [ -z "$who" ] && [ "$EVENT" != "workflow_dispatch" ]; then
            echo "보낼 사람 없음 — 건너뛴다"; exit 0
          fi
          [ -n "$who" ] || who="🔧"

          # ── 전송 ──────────────────────────────────────────────
          repo="${GITHUB_REPOSITORY##*/}"
          content=$(printf '%s **%s** · #%s %s\n%s' "$who" "$kind" "$num" "$title" "$url")

          payload=$(jq -nc --arg c "$content" \
            '{content:$c, allowed_mentions:{parse:["users"]}}')

          code=$(curl -sS -o /tmp/resp -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -X POST -d "$payload" "$WEBHOOK")

          if [ "$code" -ge 300 ]; then
            echo "전송 실패 HTTP $code"; cat /tmp/resp; exit 1
          fi
          echo "전송 완료 — $kind · #$num"

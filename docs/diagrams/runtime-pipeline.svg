<svg xmlns="http://www.w3.org/2000/svg" width="680" height="316" viewBox="0 0 680 316" role="img">
<title>런타임 — 탐지에서 조치까지</title>
<desc>블로그 글이 1단 로컬 탐지(KoBERT 스팬, 특정성 k)를 거쳐 가명화된 뒤, 2단 종합 추론(Qwen3 로컬, 동의 시 외부 LLM)으로 넘어가고, 최소 조치 추천을 거쳐 사용자가 선택하면 위험도를 재계산한다.</desc>
<style>
  .t{font:14px system-ui,-apple-system,'Malgun Gothic',sans-serif}
  .th{font:500 14px system-ui,-apple-system,'Malgun Gothic',sans-serif}
  .ts{font:12px system-ui,-apple-system,'Malgun Gothic',sans-serif}
  .arr{stroke:#898781;stroke-width:1.5;fill:none}
  .gb{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}
  .pb{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}
  .tb{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}
  .gt{fill:#2C2C2A}.gs{fill:#5F5E5A}
  .pt{fill:#3C3489}.ps{fill:#534AB7}
  .tt{fill:#085041}.tsg{fill:#0F6E56}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="316" fill="#ffffff"/>

<rect x="40" y="80" width="120" height="80" rx="4" class="gb"/>
<text x="100" y="104" class="th gt" text-anchor="middle" dominant-baseline="central">입력</text>
<text x="100" y="126" class="ts gs" text-anchor="middle" dominant-baseline="central">블로그 글 N편</text>
<text x="100" y="146" class="ts gs" text-anchor="middle" dominant-baseline="central">본인 계정</text>

<line x1="170" y1="120" x2="190" y2="120" class="arr" marker-end="url(#arrow)"/>

<rect x="200" y="80" width="120" height="80" rx="4" class="tb"/>
<text x="260" y="104" class="th tt" text-anchor="middle" dominant-baseline="central">1단 로컬 탐지</text>
<text x="260" y="126" class="ts tsg" text-anchor="middle" dominant-baseline="central">KoBERT · 특정성</text>
<text x="260" y="146" class="ts tsg" text-anchor="middle" dominant-baseline="central">→ 가명화</text>

<line x1="330" y1="120" x2="350" y2="120" class="arr" marker-end="url(#arrow)"/>

<rect x="360" y="80" width="120" height="80" rx="4" class="pb"/>
<text x="420" y="104" class="th pt" text-anchor="middle" dominant-baseline="central">2단 종합 추론</text>
<text x="420" y="126" class="ts ps" text-anchor="middle" dominant-baseline="central">Qwen3 로컬</text>
<text x="420" y="146" class="ts ps" text-anchor="middle" dominant-baseline="central">외부 LLM (동의)</text>

<line x1="490" y1="120" x2="510" y2="120" class="arr" marker-end="url(#arrow)"/>

<rect x="520" y="80" width="120" height="80" rx="4" class="tb"/>
<text x="580" y="104" class="th tt" text-anchor="middle" dominant-baseline="central">조치 추천</text>
<text x="580" y="126" class="ts tsg" text-anchor="middle" dominant-baseline="central">글별 기여도</text>
<text x="580" y="146" class="ts tsg" text-anchor="middle" dominant-baseline="central">최소 조치 산출</text>

<line x1="580" y1="170" x2="580" y2="210" class="arr" marker-end="url(#arrow)"/>

<rect x="520" y="220" width="120" height="44" rx="4" class="gb"/>
<text x="580" y="242" class="th gt" text-anchor="middle" dominant-baseline="central">사용자 선택</text>

<text x="580" y="286" class="ts gs" text-anchor="middle" dominant-baseline="central">↻ 적용 후 재계산</text>

<rect x="40" y="238" width="12" height="12" rx="2" class="tb"/>
<text x="58" y="244" class="ts tsg" dominant-baseline="central">로컬 모델</text>
<rect x="138" y="238" width="12" height="12" rx="2" class="pb"/>
<text x="156" y="244" class="ts ps" dominant-baseline="central">LLM</text>
<rect x="204" y="238" width="12" height="12" rx="2" class="gb"/>
<text x="222" y="244" class="ts gs" dominant-baseline="central">입출력</text>
</svg>

# =============================================================
#  kopl 을 import 가능하게 만든다.
#
#  ⚠️ 이 파일이 없으면 README 의 실행 예시가 그대로는 안 돈다.
#
#      python -m kopl.c5_corpus.generate ...
#      -> ModuleNotFoundError: No module named 'kopl'
#
#     소스가 src/ 아래에 있어서 저장소 루트에서 실행해도
#     sys.path 에 src 가 안 들어가기 때문이다 (src 레이아웃).
#
#  ⚠️ 의존성은 여기에 적지 않는다. requirements.txt 가 정본이다.
#     torch 는 GPU 마다 CUDA 빌드가 달라 별도 인덱스에서 깔아야 하는데,
#     여기 적으면 pip 가 기본 인덱스에서 끌어와 덮어쓴다.
# =============================================================
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kopl"
version = "0.1.0"
description = "KISIA 3팀(파도풀) — 한국어 SNS 신상 추론 위험 탐지"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
